<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Closeout</title>
<style>
  :root {
    --paper: #f7f4ed; --card: #ffffff; --ink: #121314; --ink-2: #3a3d42; --mute: #74787f; --line: #e6e1d6; --line-2: #d3cdbf;
    --ready: #178a4c; --ready-bg: #e3f4ea; --needs: #b45309; --needs-bg: #fdecd8; --unclear: #5b5f66; --unclear-bg: #e9e7e1;
    --none: #9a9ea6; --none-bg: #f0eee8; --hot: #e8590c; --link: #1b5fd6;
    --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    --sans: -apple-system, "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: var(--link); text-decoration: none; } a:hover { text-decoration: underline; }
  button { font: inherit; cursor: pointer; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 28px 80px; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 22px 0 16px; border-bottom: 1px solid var(--line); gap: 20px; }
  .wordmark { font-weight: 800; letter-spacing: .2em; font-size: 12px; text-transform: uppercase; white-space: nowrap; }
  .wordmark a { color: inherit; }
  .crumbs { font-size: 14px; color: var(--mute); display: flex; gap: 8px; align-items: center; min-width: 0; }
  .crumbs b { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crumbs span { white-space: nowrap; }

  /* projects home */
  .homehead { display: flex; align-items: flex-end; justify-content: space-between; padding: 40px 0 20px; gap: 20px; }
  .homehead h1 { margin: 0; font-size: 34px; letter-spacing: -.02em; }
  .homehead p { margin: 6px 0 0; color: var(--mute); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .pcard { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px 22px 18px; cursor: pointer; display: flex; flex-direction: column; gap: 10px; min-height: 190px; transition: border-color .15s, transform .15s; position: relative; }
  .pcard:hover { border-color: var(--ink); transform: translateY(-1px); }
  .pcard h2 { margin: 0; font-size: 20px; letter-spacing: -.01em; line-height: 1.25; }
  .pcard .addr { color: var(--mute); font-size: 13px; min-height: 20px; }
  .pcard .big { font-size: 40px; font-weight: 700; letter-spacing: -.03em; line-height: 1; margin-top: auto; }
  .pcard .big small { font-size: 14px; font-weight: 500; letter-spacing: 0; color: var(--ink-2); margin-left: 8px; }
  .pcard .meta { display: flex; gap: 14px; flex-wrap: wrap; color: var(--mute); font-size: 12px; margin-top: 4px; }
  .pcard .facts { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 6px; font-size: 12px; color: var(--mute); }
  .pcard .facts b { display: block; font-size: 16px; color: var(--ink); letter-spacing: -.01em; line-height: 1.1; }
  /* overview */
  .ov { padding-top: 26px; }
  .ov-hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 28px; align-items: stretch; }
  .ov-hero .bar { height: 10px; margin-top: 26px; }
  .ov-next { background: var(--ink); color: #fff; border-radius: 18px; padding: 24px 26px; display: flex; flex-direction: column; justify-content: space-between; gap: 16px; min-height: 190px; }
  .ov-next .k { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: rgba(255,255,255,.55); font-weight: 700; }
  .ov-next h2 { margin: 8px 0 0; font-size: 26px; letter-spacing: -.02em; line-height: 1.15; }
  .ov-next p { margin: 10px 0 0; color: rgba(255,255,255,.72); font-size: 14px; max-width: 42ch; line-height: 1.45; }
  .ov-next a { color: #fff; font-weight: 600; font-size: 14px; align-self: flex-start; border-bottom: 1px solid rgba(255,255,255,.4); }
  .ov-next a:hover { text-decoration: none; border-bottom-color: #fff; } .ov-next a::after { content: " →"; }
  .ov-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-top: 22px; }
  .ov-card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px 22px 18px; display: flex; flex-direction: column; }
  .ov-card h3 { margin: 0 0 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--mute); font-weight: 700; }
  .ov-card .line { display: flex; justify-content: space-between; gap: 14px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .ov-card .line:first-of-type { border-top: 0; padding-top: 2px; }
  .ov-card .line b { font-weight: 600; } .ov-card .line > span { color: var(--ink-2); text-align: right; flex: none; max-width: 55%; }
  .ov-card .line small { display: block; color: var(--mute); font-weight: 400; font-size: 12px; margin-top: 2px; }
  .ov-card .empty { padding: 2px 0 8px; font-size: 14px; }
  .ov-card .more { display: block; margin-top: auto; padding-top: 12px; font-size: 13px; font-weight: 600; }
  /* deficiencies: where evidence comes from now */
  .inbox { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px 24px; display: flex; flex-direction: column; gap: 6px; }
  .inbox .k { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--hot); font-weight: 700; }
  .inbox h2 { margin: 2px 0 0; font-size: 22px; letter-spacing: -.01em; } .inbox p { margin: 0; color: var(--mute); font-size: 14px; max-width: 40ch; line-height: 1.45; }
  .inbox a { margin-top: auto; padding-top: 10px; font-weight: 600; font-size: 14px; } .inbox a::after { content: " →"; }
  /* messages: the contractor link */
  .msg .link { margin-top: 14px; padding: 14px 16px; border-radius: 12px; background: var(--paper); border: 1px solid var(--line); display: flex; justify-content: space-between; gap: 14px; align-items: center; flex-wrap: wrap; }
  .msg .link.on { border-color: var(--ready); background: var(--ready-bg); }
  .msg .link > div:first-child { flex: 1; min-width: 240px; } .msg .link b { display: block; font-size: 14px; }
  .msg .link small { display: block; color: var(--mute); font-size: 12px; margin-top: 4px; max-width: 60ch; }
  .msg .link input { width: 100%; margin-top: 6px; font: inherit; font-size: 13px; font-family: var(--mono); border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 10px; background: #fff; color: var(--ink); }
  .msg .link .acts { display: flex; gap: 8px; flex-wrap: wrap; } .msg .link .btn.quiet { color: var(--mute); border-color: transparent; }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  /* the contractor's page */
  body.contractor .wordmark a { pointer-events: none; }
  .ct { max-width: 760px; }
  .ct .ct-lead { color: var(--ink-2); font-size: 16px; line-height: 1.5; margin: 14px 0 20px; max-width: 60ch; }
  .ct .drop.big { min-height: 150px; }
  .ct .ct-pk { margin-top: 22px; border-top: 1px solid var(--line); }
  .ct .ct-pk .row { display: grid; grid-template-columns: 58px 1fr auto; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 15px; align-items: start; }
  .ct .ct-pk .row .id { font-family: var(--mono); font-weight: 700; color: var(--hot); }
  .ct .ct-pk .row small { display: block; color: var(--mute); margin-top: 3px; font-size: 13px; }
  @media (max-width: 760px) { .ov-hero { grid-template-columns: 1fr; } .ct .ct-pk .row { grid-template-columns: 52px 1fr; } .ct .ct-pk .row .pill { grid-column: 2; justify-self: start; } }
  .pcard .live { position: absolute; top: 18px; right: 18px; width: 10px; height: 10px; border-radius: 50%; background: var(--hot); animation: pulse 1s infinite alternate; }
  .bar { display: flex; height: 8px; border-radius: 6px; overflow: hidden; background: var(--none-bg); }
  .bar i { display: block; height: 100%; }
  .bar .ready { background: var(--ready); } .bar .needs { background: var(--needs); } .bar .unclear { background: var(--unclear); }
  .newp { border: 2px dashed var(--line-2); background: transparent; border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 12px; justify-content: center; min-height: 190px; position: relative; transition: border-color .15s, background .15s; }
  .newp.over { border-color: var(--hot); background: #fff6ef; }
  .newp h2 { margin: 0; font-size: 16px; }
  .newp p { margin: 0; color: var(--mute); font-size: 13px; }
  .newp form { display: flex; gap: 8px; }
  .newp input[type=text] { flex: 1; font: inherit; border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 12px; background: #fff; min-width: 0; }
  .newp button { border: 1px solid var(--ink); background: var(--ink); color: #fff; border-radius: 10px; padding: 9px 14px; font-weight: 600; }
  .newp .or { position: relative; border-top: 1px solid var(--line); margin: 4px 0; }
  .newp .or span { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); background: var(--paper); padding: 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--mute); }
  .newp .folder { position: relative; text-align: center; padding: 8px; border-radius: 10px; font-size: 13px; color: var(--ink-2); }
  .newp .folder input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .newp.over .folder, .newp .folder:hover { background: #fff; }
  .newp .np-k { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--hot); font-weight: 700; }
  .newp h2.np-t { font-size: 22px; letter-spacing: -.01em; line-height: 1.15; margin: 4px 0 0; }
  .newp .np-zip { position: relative; display: flex; flex-direction: column; gap: 2px; padding: 16px 18px; border-radius: 14px; background: var(--ink); color: #fff; cursor: pointer; transition: background .15s; }
  .newp .np-zip b { font-size: 15px; } .newp .np-zip span { font-size: 12px; color: rgba(255,255,255,.72); }
  .newp .np-zip:hover { background: #2a2c30; }
  .newp .np-zip input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .newp .np-steps { display: grid; gap: 8px; margin-top: 2px; }
  .newp .np-steps div { display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: baseline; font-size: 13px; color: var(--ink-2); line-height: 1.35; }
  .newp .np-steps i { font: 700 11px var(--mono); color: var(--mute); font-style: normal; }
  .zipbtn { position: relative; z-index: 1; display: inline-block; margin-top: 14px; border: 1px solid var(--ink); background: var(--ink); color: #fff; border-radius: 10px; padding: 9px 16px; font-weight: 600; font-size: 13px; cursor: pointer; }
  .zipbtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .drop.small .zipbtn { margin: 0 0 0 auto; flex: none; }
  .lead { margin: 6px 0 0; color: var(--ink-2); max-width: 70ch; }
  .files { display: grid; gap: 10px; margin-top: 14px; }
  .files details { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 0 18px; }
  .files summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 40px 1fr auto; gap: 14px; align-items: center; padding: 14px 0; }
  .files summary::-webkit-details-marker { display: none; }
  .files summary i { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 11px; background: var(--ink); color: #fff; font: 700 12px/1 var(--mono); font-style: normal; letter-spacing: .04em; }
  .files summary i.soft { background: var(--none-bg); color: var(--ink-2); border: 1px solid var(--line-2); }
  .files summary b { display: block; font-size: 16px; }
  .files summary span { display: block; font-size: 13px; color: var(--mute); margin-top: 2px; }
  .files summary em { font-style: normal; font-size: 12px; color: var(--mute); white-space: nowrap; }
  .files .frows { border-top: 1px solid var(--line); padding: 6px 0 12px; }
  .files .frow { display: grid; grid-template-columns: 96px 1fr auto; gap: 12px; padding: 8px 0; font-size: 13px; border-top: 1px solid var(--line); align-items: baseline; }
  .files .frow:first-child { border-top: 0; }
  .files .frow b { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--mute); font-weight: 600; }
  .files .frow.cur b { color: var(--ready); }
  .files .frow span { color: var(--ink-2); word-break: break-word; } .files .frow small { color: var(--mute); font-family: var(--mono); font-size: 11px; white-space: nowrap; }
  .rev { display: grid; gap: 14px; margin-top: 14px; }
  .rev .disc { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px 6px; }
  .rev .revnote { margin: -4px 0 8px; font-size: 13px; color: var(--mute); }
  .rev .revother { margin: 14px 0 4px; padding-top: 12px; border-top: 1px dashed var(--line-2); font-size: 13px; font-weight: 600; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; } .rev .revother small { font-weight: 400; color: var(--mute); }
  .rev .disc h4 { margin: 0 0 6px; font-size: 15px; display: flex; gap: 10px; align-items: baseline; } .rev .disc h4 small { color: var(--mute); font-weight: 500; font-size: 12px; }
  .rev .r { display: grid; grid-template-columns: 96px 1fr; gap: 14px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13px; position: relative; }
  .rev .r time { font-family: var(--mono); font-size: 12px; color: var(--mute); padding-top: 2px; } .rev .r.cur time { color: var(--ready); font-weight: 700; }
  .rev .r span a.file { color: var(--ink-2); text-decoration: underline; text-decoration-color: #c9ccd2; text-underline-offset: 3px; } .rev .r span a.file:hover { color: var(--ink); }
  .rev .r b { display: block; font-weight: 600; } .rev .r span { display: block; color: var(--mute); font-size: 12px; margin-top: 2px; word-break: break-word; }
  .occ { margin-top: 14px; display: grid; gap: 12px; }
  .occ .tally { display: flex; align-items: baseline; gap: 12px; } .occ .tally b { font-size: 34px; font-weight: 700; letter-spacing: -.03em; } .occ .tally span { color: var(--mute); font-size: 14px; }
  .occ .grp { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 18px 6px; }
  .occ .grp summary { list-style: none; cursor: pointer; display: flex; align-items: baseline; gap: 12px; padding: 4px 0 6px; }
  .occ .grp summary::-webkit-details-marker { display: none; }
  .occ .grp h4 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--mute); font-weight: 600; }
  .occ .grp summary .n { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--mute); white-space: nowrap; } .occ .grp.some summary .n { color: var(--ready); }
  .occ .grp summary::after { content: "+"; color: var(--mute); font-size: 16px; line-height: 1; margin-left: 10px; } .occ .grp[open] summary::after { content: "–"; }
  .occ .it { display: grid; grid-template-columns: 14px 1fr; gap: 12px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .occ .it i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line-2); display: inline-block; position: relative; top: 1px; } .occ .it.on i { background: var(--ready); border-color: var(--ready); }
  .occ .it span { display: block; font-size: 12px; color: var(--mute); word-break: break-word; } .occ .it.on span { color: var(--ready); }
  .occ .it:not(.on) b { font-weight: 500; }
  .rev .r .cmpbtn { align-self: start; justify-self: end; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 5px 12px; font: 600 12px/1.2 var(--sans); cursor: pointer; white-space: nowrap; }
  .rev .r .cmpbtn:hover, .rev .r .cmpbtn.on { border-color: var(--ink); } .rev .r .cmpbtn.on { background: var(--ink); color: var(--card); }
  .rev .r:has(.cmpbtn) { grid-template-columns: 96px 1fr auto; }
  .rev .cmp { grid-column: 1 / -1; margin: 6px 0 4px; padding: 16px 18px 12px; border-radius: 12px; background: var(--paper); border: 1px solid var(--line); display: grid; gap: 14px; }
  .rev .cmp .wait { margin: 0; color: var(--mute); font-size: 13px; }
  .rev .cmp .head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; } .rev .cmp .head b { font-size: 14px; } .rev .cmp .head > div > span { color: var(--mute); font-size: 12px; margin-left: 8px; }
  .rev .cmp .counts { display: flex; gap: 6px; flex-wrap: wrap; } .rev .cmp .counts span { font: 600 12px/1 var(--sans); padding: 5px 9px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); color: var(--mute); }
  .rev .cmp .counts .added { color: #0b6b3a; border-color: #bfe3cf; background: #ecf8f0; } .rev .cmp .counts .removed { color: #9a2f22; border-color: #f0c9c2; background: #fdf1ee; }
  .rev .cmp .counts .renumbered, .rev .cmp .counts .changed { color: #8a5a00; border-color: #f2ddad; background: #fff6e3; }
  .rev .cmp .grp h5 { margin: 0 0 6px; font-size: 13px; display: flex; gap: 8px; align-items: baseline; } .rev .cmp .grp h5 small { color: var(--mute); font-weight: 500; }
  .rev .cmp .grp ul { margin: 0; padding-left: 18px; font-size: 13px; } .rev .cmp .grp li { margin: 2px 0; } .rev .cmp .grp p { margin: 0; font-size: 13px; color: var(--mute); }
  .rev .cmp .sh { color: var(--ink); text-decoration: none; font-family: var(--mono); font-size: 12px; font-weight: 700; } .rev .cmp .sh i { font-style: normal; font-family: var(--sans); font-weight: 500; margin-left: 6px; } .rev .cmp .sh:hover { text-decoration: underline; }
  .rev .cmp .sheet { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 6px 0; }
  .rev .cmp .sheet .top { display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; } .rev .cmp .sheet .top span { color: var(--mute); font-size: 12px; margin-left: auto; } .rev .cmp .sheet .top em, .rev .cmp .grp li em { color: #8a5a00; font-style: normal; font-size: 12px; }
  .rev .cmp .sheet .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 8px; } .rev .cmp .sheet h6 { margin: 0 0 4px; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--mute); }
  .rev .cmp .sheet ul { padding-left: 16px; font-family: var(--mono); font-size: 11.5px; line-height: 1.45; word-break: break-word; } .rev .cmp .sheet .cols > div:first-child li { color: #0b6b3a; } .rev .cmp .sheet .cols > div:last-child li { color: #9a2f22; text-decoration: line-through; text-decoration-color: #f0c9c2; }
  .rev .cmp .sheet .more, .rev .cmp .sheet .redrawn { margin: 8px 0 0; font-size: 12px; color: var(--mute); } .rev .cmp .sheet .redrawn a { color: var(--ink); }
  .rev .cmp .inline { color: var(--ink) !important; } .rev .cmp .who ul { list-style: none; padding: 0; } .rev .cmp .who li { padding: 6px 10px; border-left: 3px solid #f2ddad; background: #fff6e3; border-radius: 0 8px 8px 0; margin: 6px 0; } .rev .cmp .who li span { color: var(--mute); font-size: 12px; }
  .rev .cmp .basis { margin: 0; font-size: 12px; color: var(--mute); border-top: 1px solid var(--line); padding-top: 10px; }
  @media (max-width: 760px) { .files .frow, .rev .r, .rev .r:has(.cmpbtn) { grid-template-columns: 1fr; gap: 2px; } .rev .r .cmpbtn { justify-self: start; margin-top: 4px; } .rev .cmp .sheet .cols { grid-template-columns: 1fr; } }

  /* project page */
  .phead { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; padding: 30px 0 0; }
  .phead h1 { margin: 0; font-size: 30px; letter-spacing: -.02em; line-height: 1.2; }
  .phead .sub { color: var(--mute); margin-top: 4px; font-size: 14px; }
  .phead .btn { white-space: nowrap; }
  .tabs { display: flex; gap: 4px; margin-top: 22px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  .tabs a { white-space: nowrap; padding: 10px 14px; color: var(--mute); font-weight: 600; font-size: 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs a:hover { text-decoration: none; color: var(--ink); }
  .tabs a.on { color: var(--ink); border-bottom-color: var(--ink); }
  .tabs a small { font-weight: 500; color: var(--mute); margin-left: 6px; font-size: 12px; }

  .hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 28px; align-items: stretch; padding: 30px 0 22px; }
  .count { font-size: clamp(56px, 8vw, 96px); font-weight: 700; line-height: .95; letter-spacing: -.03em; margin: 0; }
  .count small { display: block; font-size: 20px; font-weight: 500; letter-spacing: 0; color: var(--ink-2); margin-top: 12px; }
  .hero .bar { height: 10px; margin-top: 26px; }
  .legend { display: flex; gap: 18px; margin-top: 12px; font-size: 13px; color: var(--mute); flex-wrap: wrap; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }

  .drop { position: relative; border: 2px dashed var(--line-2); border-radius: 18px; background: var(--card); display: flex; flex-direction: column;
          justify-content: center; align-items: center; text-align: center; padding: 34px 28px; min-height: 230px; transition: border-color .15s, background .15s; }
  .drop.over { border-color: var(--hot); background: #fff6ef; }

<body>
<div class="wrap">

    <div class="livebar" id="livebar" data-state="tap"><button class="orb" id="liveorb" type="button" aria-label="Talk"></button><div class="words"><b id="livestate">Tap to talk</b><span id="livewords">Closeout is listening for a question</span></div><button class="end" id="liveend" type="button">End</button></div>
  </div>

<script>
// The live site asks for the office code once; if it is missing, go and get it.
const _fetch = window.fetch.bind(window);
window.fetch = async (url, opts) => {
  const res = await _fetch(url, opts);
  if (res.status === 401 && String(url).startsWith("/api/") && !String(url).startsWith("/api/c/")) location.href = "/signin";
  return res;
};

const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const when = s => { const d = new Date(s); return isNaN(d) ? String(s ?? "") : d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }); };
const fileUrl = (id, page) => `/api/evidence/${id}/file` + (page ? `#page=${page}` : "");
const isImg = name => /\.(jpe?g|png|heic|heif|webp)$/i.test(name || "");
const state = { home: null, p: null, slug: null, es: null, run: { kind: "idle", text: "", done: 0, total: 0 }, fieldDisc: null, filing: null, viewer: null, shot: null, openReview: null, finishing: null, confirmFinish: null, drafting: null, mapping: null, docsAsking: false, filters: { bld: "", disc: "", rv: "" }, folder: [], pinMode: "", brief: {}, briefOpen: {}, starting: null, cov: {}, unitLog: null, stagesEdit: null };

function toast(msg, err) { const t = $("#toast"); t.textContent = msg; t.className = "toast show" + (err ? " err" : ""); setTimeout(() => t.className = "toast", 3200); }
function route() {
  const c = location.pathname.match(/^\/c\/([^/]+)/); if (c) return { page: "contractor", token: decodeURIComponent(c[1]) };
  const h = location.hash.replace(/^#\/?/, "");
  let m = h.match(/^p\/([^/]+)\/item\/(.+)$/); if (m) return { page: "item", slug: m[1], id: decodeURIComponent(m[2]) };
  m = h.match(/^p\/([^/]+)\/field\/([^/]+)$/); if (m) return { page: "sheet", slug: m[1], sheetId: m[2] };
  m = h.match(/^p\/([^/]+)\/?(deficiencies|drawings|docs|field|evidence|messages)?$/); if (m) return { page: "project", slug: m[1], tab: m[2] === "evidence" ? "messages" : m[2] === "deficiencies" ? "list" : m[2] || "overview" };
  return { page: "home" };
}
const pUrl = (slug, tail) => `/api/projects/${encodeURIComponent(slug)}${tail || ""}`;
const pHash = (slug, tail) => `#/p/${encodeURIComponent(slug)}${tail || ""}`;

/* ---- plain-English status ---------------------------------------------- */
function status(i) {
  if (i.completeness === "complete") return { k: "ready", t: "Ready ✓" };
  if (i.completeness === "incomplete") { const t = [...new Set(i.missing_slots.map(m => m.type))]; return { k: "needs", t: "Needs " + t.join(" + ") }; }
  if (i.completeness === "needs_clarification") return { k: "unclear", t: "Unclear" };
  return { k: "none", t: "Nothing yet" };
}
const CALL = { accept: "Ready to close", reject: "Not accepted", hold: "On hold" };
const CALL_K = { accept: "ready", reject: "needs", hold: "unclear" };
/* what the pill says: the engineer's call when there is one, else where the evidence stands */
function callPill(i) { const d = i.decision && i.decision.decision; return d && CALL[d] ? { k: CALL_K[d], t: CALL[d], ev: status(i).t } : { ...status(i), ev: "" }; }
function items() {
  const p = state.p, pk = p.packet;
  const blank = d => ({ item: d, completeness: "no_evidence", evidence: [], unresolved: [], missing_slots: d.slots, history: [], followup_draft: null, decision: null });
  if (!pk) return p.register.map(blank);
  const seen = new Set(pk.items.map(i => i.item.item_id));
  return [...pk.items, ...p.register.filter(d => !seen.has(d.item_id)).map(blank)];
}

/* ---- data ----------------------------------------------------------- */
async function load() {
  const r = route();
  if (r.page === "contractor") {
    const res = await fetch(`/api/c/${encodeURIComponent(r.token)}`);
    state.p = res.ok ? await res.json() : null; state.slug = r.token;
    render(); return;
  }
  if (r.page === "home") {
    state.home = await (await fetch("/api/projects")).json();
    if (state.home.active_run_id && !state.es) follow(state.home.active_run_id);
  } else {
    const res = await fetch(pUrl(r.slug));
    if (!res.ok) { state.p = null; state.slug = r.slug; render(); return; }
    state.p = await res.json(); state.slug = r.slug; state.cov = {};
    if (state.p.active_run_id && !state.es) follow(state.p.active_run_id);
  }
  render();
}
function render() {
  const r = route(), p = state.p;
  const inP = r.page !== "home" && p;
  document.body.classList.toggle("viewing", r.page === "sheet" && !!p);
  $("#crumbs").innerHTML = inP ? `<a href="#/">Projects</a><span>›</span><b>${esc(p.project.name)}</b>${r.page === "item" ? `<span>›</span><span>${esc(r.id)}</span>` : ""}` : `<span>${state.home ? `${state.home.projects.length} project${state.home.projects.length === 1 ? "" : "s"}` : ""}</span>`;
  if (r.page === "contractor") { document.body.classList.add("contractor"); $("#crumbs").innerHTML = p ? `<span>${esc(p.project.name)}</span>` : ""; renderContractor(); renderAsk(); return; }
  if (r.page === "home") renderHome();
  else if (!p) $("#main").innerHTML = `<a class="back" href="#/">← Projects</a><p class="empty">That project is not here.</p>`;
  else if (r.page === "item") renderItem(r.id);
  else if (r.page === "sheet") renderSheet(r.sheetId);
  else renderProject(r.tab);
  renderAsk();
}

/* ---- projects home --------------------------------------------------- */
function cardLast(c) {
  const bits = [];
  if (c.reviews_active) bits.push(`${c.reviews_active} review${c.reviews_active === 1 ? "" : "s"} in progress`);
  if (c.links) bits.push(`${c.links} contractor link${c.links === 1 ? "" : "s"} active`);
  const lastD = c.last_drop_at || "", lastM = c.last_message_at || "";
  if (lastD && lastD >= lastM) bits.push(`evidence in ${esc(when(lastD))}`);
  else if (lastM) bits.push(`message drafted ${esc(when(lastM))}`);
  else if (c.last_activity) bits.push(`updated ${esc(when(c.last_activity))}`);
  return bits.map(b => `<span>${b}</span>`).join("");
}
function renderHome() {
  const h = state.home, list = h.projects;
  $("#main").innerHTML = `
    <div class="homehead"><div><h1>Projects</h1><p>${list.length ? "Open a project to review its deficiencies, drawings and the evidence contractors sent." : "Start with a project: upload one zip of its folder. The app files it, reads the current sheets and lists what is missing."}</p></div></div>
    <div class="status ${esc(state.run.kind)}" id="status" ${state.run.kind === "idle" ? "hidden" : ""}></div>
    <div class="cards" style="margin-top:18px">
      ${list.map(c => { const pct = k => c.items ? (c[k] / c.items * 100) + "%" : "0%"; return `
      <div class="pcard" data-slug="${esc(c.slug)}">
        ${c.active ? `<span class="live" title="Working"></span>` : ""}
        <h2>${esc(c.name)}</h2>
        <div class="addr">${esc([[c.address, c.city].filter(Boolean).join(", "), c.building_type].filter(Boolean).join(" · ") || (c.sheets ? "" : "No drawings yet"))}</div>

        <div class="bar"><i class="ready" style="width:${pct("ready")}"></i><i class="needs" style="width:${pct("needs")}"></i><i class="unclear" style="width:${pct("unclear")}"></i></div>
        <div class="facts"><span><b>${c.units}</b>unit${c.units === 1 ? "" : "s"}</span><span><b>${c.sheets}</b>sheet${c.sheets === 1 ? "" : "s"}</span><span><b>${c.reviews_active + c.reviews_finished}</b>field review${c.reviews_active + c.reviews_finished === 1 ? "" : "s"}</span><span><b>${c.drops}</b>drop${c.drops === 1 ? "" : "s"}</span></div>
        <div class="meta">${cardLast(c)}</div>
      </div>`; }).join("")}
      <div class="newp" id="newp">
        <div><span class="np-k">New project</span><h2 class="np-t">Send the whole folder once.</h2></div>
        <div class="np-steps"><div><i>1</i>Zip the project folder as it is: every discipline, every issue, the letters too.</div><div><i>2</i>Closeout files it by discipline and date, and reads every current sheet.</div><div><i>3</i>You see what is missing: drawings before the review, documents before occupancy.</div></div>
        <label class="np-zip"><b>Upload the project zip</b><span>From the phone or the computer · one .zip</span><input type="file" accept=".zip,application/zip,application/x-zip-compressed"></label>
        <div class="folder">or drop the folder here from a computer<input type="file" webkitdirectory multiple></div>
        <div class="or"><span>or start by name</span></div>
        <form id="newForm"><input type="text" id="newName" placeholder="Project name, e.g. Maple Court" autocomplete="off"><button type="submit">Create</button></form>
      </div>
    </div>
    <footer><span>Closeout drafts. The engineer decides.</span></footer>`;
  $("#main").querySelectorAll(".pcard").forEach(c => c.onclick = () => location.hash = pHash(c.dataset.slug));
  $("#newForm").onsubmit = async e => {

    const j = await r.json().catch(() => ({}));

/* ---- project page ----------------------------------------------------- */
function renderProject(tab) {
  const p = state.p, pr = p.project, c = p.card, slug = state.slug;
  const T = { overview: "Overview", list: "Deficiencies", field: "Field review", drawings: "Drawings", docs: "Documents", messages: "Messages" };
  const counts = { overview: null, list: c.items, field: p.reviews.filter(r => r.status === "active").length || p.reviews.length, drawings: c.sheets, docs: (pr.documents || []).length, messages: p.messages.length + c.drops };
  $("#main").innerHTML = `
    <div class="phead">
      <div><h1>${esc(pr.name)}</h1><div class="sub">${esc([pr.address, pr.city, pr.building_type].filter(Boolean).join(" · ") || "No drawings read yet")}</div></div>

    <div id="tab"></div>`;
  ({ overview: renderOverview, list: renderList, field: renderField, drawings: renderDrawings, docs: renderDocs, messages: renderMessages })[tab]();
}

function renderOverview() {
  const p = state.p, pr = p.project, c = p.card, slug = state.slug, all = items(), blds = buildings();
  const n = { ready: 0, needs: 0, unclear: 0, none: 0 }; all.forEach(i => n[status(i).k]++);
  const pct = k => all.length ? (n[k] / all.length * 100) + "%" : "0%";
  const plural = (k, one, many) => `${k} ${k === 1 ? one : many || one + "s"}`;
  const active = p.reviews.filter(r => r.status === "active"), done = p.reviews.filter(r => r.status === "finished");
  const linkFor = r => p.shares.find(x => x.review_id === r.id && !x.revoked_at);
  const drops = p.batches, fromC = drops.filter(b => b.via).length, lastDrop = drops[drops.length - 1];
  const msgs = [...p.messages].sort((a, b) => (b.updated_at || b.created_at).localeCompare(a.updated_at || a.created_at)), lastMsg = msgs[0];
  const discs = disciplines();
  let next;
  if (!pr.sheets.length) next = { t: "Add the project drawings", s: "Upload the project folder or its zip on Drawings. The current sheets are read, and the units and floors come from them.", h: "/drawings", a: "Drawings" };
  else if (!p.register.length) next = { t: "Start the first field review", s: "Walk the site with the phone: photo, pin, note. Every item is numbered on its sheet.", h: "/field", a: "Field review" };
  else if (active.length) next = { t: `Finish ${active[0].title}`, s: "Finishing freezes the list for the contractor and drafts the covering message.", h: "/field", a: "Field review" };
  else if (done.some(r => r.package && r.package.count && !linkFor(r))) next = { t: "Send the review to the contractor", s: "Create the contractor's link on Messages, then copy the message into your email. What they send comes back through the link.", h: "/messages", a: "Messages" };
  else if (n.ready) next = { t: `Decide on ${plural(n.ready, "ready item")}`, s: "Open each one, check what came back, and mark it ready to close or not accepted.", h: "/deficiencies", a: "Deficiencies" };
  else if (all.length) next = { t: "Waiting on the contractor", s: `${plural(all.length - n.ready, "item")} still need evidence. It arrives through the contractor's link and is filed to the item it belongs to.`, h: "/messages", a: "Messages" };
  else next = { t: "Start a field review", s: "Walk the site with the phone: photo, pin, note.", h: "/field", a: "Field review" };
  const unitsOf = b => b.units.map(u => u.label.replace(/^unit\s+/i, "").replace(/\s*\(.*\)\s*$/, "")).join(", ");
  $("#tab").innerHTML = `
    <div class="ov">
      <div class="ov-hero">
        <div>
          <p class="count">${n.ready} of ${all.length}<small>ready to close</small></p>
          <div class="bar"><i class="ready" style="width:${pct("ready")}"></i><i class="needs" style="width:${pct("needs")}"></i><i class="unclear" style="width:${pct("unclear")}"></i></div>
          <div class="legend"><span><i style="background:var(--ready)"></i>${n.ready} ready</span><span><i style="background:var(--needs)"></i>${n.needs} need something</span><span><i style="background:var(--unclear)"></i>${n.unclear} unclear</span><span><i style="background:var(--none-bg);border:1px solid var(--line-2)"></i>${n.none} nothing yet</span></div>
        </div>
        <div class="ov-next"><div><span class="k">Next</span><h2>${esc(next.t)}</h2><p>${esc(next.s)}</p></div><a href="${pHash(slug, next.h)}">${esc(next.a)}</a></div>
      </div>
      <div class="ov-grid">
        <div class="ov-card"><h3>The site</h3>
          ${pr.address || pr.city || pr.building_type ? `<div class="line"><b>${esc([pr.address, pr.city].filter(Boolean).join(", ") || "Address not read yet")}</b><span>${esc(pr.building_type || "")}</span></div>` : ""}

/* The Documents tab as a folder tree, the way a file explorer shows it. Two top folders: the occupancy paperwork

   itself: Site first, then one folder per building, each with a folder per discipline holding the letters, forms and
   drawing issues that belong there. Blanks (what is not on file yet) are dashed rows inside the right folder. Anything
   the CRP list carries that this project does not need (say, building envelope) is ticked "not in scope" and drops out

    if (!secs.has(grp)) { const f = folder("crp/" + secs.size, grp, "", { sec: true }); secs.set(grp, f); crp.folders.push(f); }
    const rx = new RegExp(re, "i"), files = [...new Set([...docs.filter(d => rx.test(baseName(d))).map(baseName), ...onFile.filter(o => o.checklist === name).map(o => o.file)])];
    secs.get(grp).items.push({ kind: "check", name, files, out: scope.has(name), agent: onFile.some(o => o.checklist === name) });
  });
  secs.forEach(f => { const inn = f.items.filter(i => !i.out); f.got = inn.filter(i => i.files.length).length; f.need = inn.length; f.out = f.items.length - inn.length; f.meta = `${f.got} of ${f.need} on file${f.out ? ` · ${f.out} not in scope` : ""}`; });

  const site = folder("site", "Site", "everything that covers all buildings", { site: true });
  const siteDisc = {}, codes = [...new Set([...discs.map(d => d.code), ...docs.map(d => d.discipline)])];
  codes.forEach(code => { const f = folder("site/" + code, code in DISC_NAMES ? dn(code) : groupName(code), "", { code }); siteDisc[code] = f; site.folders.push(f); });
  docs.forEach(d => { const pl = placed.get(baseName(d)); if (pl && pl.building) return; const code = (pl && pl.discipline) || d.discipline; (siteDisc[code] || siteDisc.OTHER || site).items.push(fileItem(d)); });
  missing.filter(m => !m.building).forEach(m => (siteDisc[m.discipline] || site).items.push(ghost(m, "agent")));
  const bfs = blds.map(b => {
    const units = b.units.map(u => u.label.replace(/\s*\(.*$/, "")).join(", ");
    const bf = folder("b/" + b.key, b.name, units || "named on the drawings", { bld: b.key, badge: b.key });

  root.folders.push(crp, prj);

}

/* What to ask the client or the architect for before the first field review. Plain code over the sheet readings; no agent call,

function docsNeeded(pr) {

    if (!shs.length) { out.push({ code: d.code, what: `${name} drawings`, why: `The folder has a ${name.toLowerCase()} set but none of its sheets could be read.` }); continue; }
    if (!plans.length) {
      const has = [...new Set(shs.map(kindOf).filter(Boolean))].map(k => k.replace(/_/g, " ")).join(", ");
      out.push({ code: d.code, what: `${name} floor plans, one per building`, why: `The current ${name.toLowerCase()} set (${shs.length} sheet${shs.length === 1 ? "" : "s"}: ${has}) has no floor plans. On site the architectural plans stand in.` });
    } else {

    }

  // title or summary says so; the line names the sheets looked at so the engineer can check the claim in a minute.
  const text = sh => ((sh.title || "") + " " + ((sh.read || {}).summary || "")).toUpperCase();
  const is = (kind, re) => sh => kindOf(sh) === kind || re.test(text(sh));
  const site = is("site_plan", /SITE PLAN|SITE SERVIC/), notes = is("notes", /\bNOTES\b|SPECIFICATION/), sched = is("schedule", /SCHEDULE/);
  const EXPECT = {
    AR: [["Site plan", site], ["Elevations", is("elevation", /ELEVATION/)], ["Building sections", is("section", /\bSECTION/)]],
    EL: [["Electrical site plan with the service entry", site], ["Single-line diagram", sh => /SINGLE.?LINE|\bSLD\b|RISER DIAGRAM/.test(text(sh))], ["Electrical notes and specifications", notes], ["Panel schedule", is("schedule", /PANEL SCHEDULE|SCHEDULE/)]],
    PL: [["Plumbing site plan with the services", site], ["Plumbing notes and specifications", notes], ["Fixture schedule", sched]],
    ME: [["Mechanical notes and specifications", notes], ["Equipment schedule", sched]],
    ST: [["Structural general notes", notes], ["Structural details", is("details", /DETAIL/)]],
    FP: [["Fire protection notes", notes]], SP: [["Sprinkler notes", notes]],
    LA: [["Landscape plan", is("landscape", /LANDSCAPE/)]], CV: [["Site servicing plan", site]],
  };
  for (const d of discs) {
    const shs = sheetsOf(d.code), name = DISC_NAMES[d.code] || d.name || d.code;
    if (!shs.length) continue;
    const looked = shs.map(sh => sh.sheet_number || "p." + sh.page).join(", ");
    for (const [what, test] of EXPECT[d.code] || []) {
      if (shs.some(test)) continue;
      out.push({ code: d.code, what, why: `The current ${name.toLowerCase()} set has no sheet titled or read as ${what.toLowerCase()}. Looked at ${looked}.` });
    }
  }
  const dated = discs.filter(d => d.dated).sort((a, b) => a.dated < b.dated ? 1 : -1);
  if (dated.length > 1) {
    const newest = dated[0], old = dated.filter(d => d.dated < newest.dated);

  }
  const noDate = discs.filter(d => !d.dated);
  for (const d of noDate) out.push({ code: d.code, what: `Issue date and revision of the ${(DISC_NAMES[d.code] || d.name).toLowerCase()} set`, why: "No date could be read from the folder or the file name." });
  return out;
}

      const j = await r.json().catch(() => ({}));

    } catch (e) { drw.run.failed++; toast(`Lost the connection on ${s.sheet_number}`, true); }

      if (r.ok) { drw.run.cost = j.review.cost_usd; drw.open = rv.id; toast(`${DISC_NAMES[code] || code} set read · ${usd(j.review.cost_usd)}`); }
      else toast(j.detail || "Could not write the set summary; press Continue to try again", true);
    } catch (e) { toast("Lost the connection on the set summary; press Continue to try again", true); }
  } else if (stopped) toast(`Stopped · ${usd(drw.run.cost)} so far · press Continue when ready`);
  else toast("No sheet could be read; check the connection and press Continue", true);

  await load();
}

async function retry(runId) {

}

function sentCard(f, unresolved) {
  let how, cls = "sure";
  if (unresolved) {
    cls = "unsure";
    how = f.kind === "weak_match" ? "Fits this item, but nothing on the file confirms where it was taken" : f.kind === "ambiguous" ? `Could be ${(f.candidates || []).join(" or ")}` : `Says it is somewhere else (${(f.flags || []).includes("conflicting_reference") ? "its own label contradicts the list" : "conflict"})`;
  } else {
    const fl = f.flags || [];
    how = f.provenance === "office" ? "Filed by the office" : f.tier === "explicit" ? "Named on the file or in the note" : f.tier === "strong" ? (fl.includes("location_by_reference") ? "Same spot as the engineer's photo" : fl.includes("location_from_sequence") ? "Taken right after a photo that names the place" : "Place and scope both on the file") : "Location not confirmed";
    if (f.tier === "weak") cls = "unsure";
  }
  const obs = (f.observations || []).filter(o => o.text).map(o => o.text);
  const src = (f.sources || []).map(s => `<a href="${fileUrl(s.evidence_id, s.page)}" target="_blank">open${s.page ? ` page ${s.page}` : ""}</a>`).join(" · ");
  return `<div class="card"><div class="thumb">${isImg(f.filename) ? `<img src="${fileUrl(f.evidence_id)}" alt="">` : esc((f.filename || "").split(".").pop().toUpperCase())}</div>
    <div><div class="file">${esc(f.filename)}</div>
      <div class="how ${cls}"><b>${esc(how)}</b>${!unresolved && f.slot_index >= 0 ? ` · fills “${esc(slotName(f))}”` : ""}</div>
      <p>${esc(f.rationale)}</p>${obs.length ? `<details class="obs"><summary>${obs.length} things in the ${isImg(f.filename) ? "photo" : "file"}</summary><ul>${obs.map(o => `<li>${esc(o)}</li>`).join("")}</ul></details>` : ""}
      <div class="open">${src}</div></div></div>`;
}
function dedupe(hist) {
  const out = []; let last = "";
  for (const h of hist) { const k = h.run_started_at + "|" + h.completeness; if (k !== last) out.push(h); last = k; }
  return out;
}
function slotName(f) {
  const i = items().find(x => x.evidence.some(e => e.finding_id === f.finding_id));
  const sl = i && i.item.slots[f.slot_index];
  return sl ? sl.type : "";
}

const DISC_NAMES = { AR: "Architectural", EL: "Electrical", PL: "Plumbing", ME: "Mechanical", ST: "Structural", CV: "Civil", LA: "Landscape", FP: "Fire protection" };
function disciplines() {
  const out = {};
  state.p.project.sheets.forEach(sh => { const d = out[sh.discipline] = out[sh.discipline] || { code: sh.discipline, name: sh.discipline_name || DISC_NAMES[sh.discipline] || sh.discipline, sheets: [] }; d.sheets.push(sh); });
  return Object.values(out);
}
const activeReview = code => state.p.reviews.find(r => r.discipline === code && r.status === "active") || null;
const findingsOn = sheetId => state.p.register.filter(d => d.sheet_id === sheetId);
const findingsIn = reviewId => state.p.register.filter(d => d.review_id === reviewId);

function liveUnlockAudio() {
  try { if (!live.audio) { live.audio = new Audio(); live.audio.preload = "auto"; } live.audio.src = SILENT; live.audio.play().catch(() => {}); } catch (e) {}
}
function livePhoneVoice(text, finish) {
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text)); u.lang = "en-CA"; u.rate = 1.04; const v = liveVoice(); if (v) u.voice = v;
    u.onend = finish; u.onerror = finish; live.speaking = u;
    window.speechSynthesis.speak(u);
    setTimeout(finish, Math.min(30000, 2500 + String(text).length * 75));   // iOS sometimes drops onend
  } catch (e) { finish(); }
}
async function liveSpeak(text, then) {
  let done = false; const finish = () => { if (done) return; done = true; live.speaking = null; then(); };
  liveSet("speaking", text);
  if (await voiceStatus() && live.audio) {
    try {
      const r = await fetch(pUrl(state.slug, "/speak"), { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text: String(text) }) });
      if (!r.ok) throw new Error("no voice");
      if (!live.on) return;
      const blob = await r.blob();
      if (live.audioUrl) URL.revokeObjectURL(live.audioUrl);
      live.audioUrl = URL.createObjectURL(blob);
      const a = live.audio; a.onended = finish; a.onerror = finish; a.src = live.audioUrl; live.speaking = a;
      await a.play();
      setTimeout(finish, 45000);
      return;
    } catch (e) { /* fall through to the phone's own voice */ }
  }
  if (live.on) livePhoneVoice(text, finish);
}
function liveHush() {
  try { window.speechSynthesis.cancel(); } catch (e) {}
  try { if (live.audio) { live.audio.pause(); live.audio.onended = null; live.audio.onerror = null; live.audio.removeAttribute("src"); } } catch (e) {}
}
function liveListen() {
  if (!live.on || live.rec || live.mode !== "phone") return;
  liveHush();
  const rec = new SR(); rec.lang = "en-CA"; rec.interimResults = true; rec.maxAlternatives = 1;
  let heard = "", final = "";
  rec.onresult = ev => { let t = ""; for (const r of ev.results) t += r[0].transcript; heard = t; $("#livewords").textContent = t; if (ev.results[ev.results.length - 1].isFinal) final = t; };
  rec.onerror = ev => { if (ev.error === "not-allowed") { live.denied = true; toast("Allow the microphone in the browser to talk with Closeout", true); } };
  rec.onend = () => {
    live.rec = null;
    if (!live.on) return;
    const q = (final || heard).trim();
    if (q) { live.misses = 0; liveHeard(q); return; }
    live.misses += 1;
    if (live.denied || live.misses >= 3) { liveSet("tap", "Tap the circle when you are ready"); return; }
    liveListen();
  };
  try { live.rec = rec; rec.start(); liveSet("listening", "…"); }
  catch (e) { live.rec = null; liveSet("tap", "Tap the circle to talk"); }
}
/* How an answer is said depends on the mode: the phone reads it, or it is handed to the spoken conversation. */
function liveSay(text) { if (live.mode === "rtc") rtcSay(text); else liveSpeak(text, liveListen); }
async function liveHeard(q) {
  if (live.pending) {
    const action = live.pending;
    const short = q.trim().split(/\s+/).length <= 6;
    if (NO.test(q)) { live.pending = null; askDropAction(); liveHistory(q, "Left as it was."); liveSay("Okay, left as it was."); return; }
    if (YES.test(q) && short) {
      live.pending = null; liveSet("thinking", q);
      if (!$("#askact")) askPanel(live.last.q, live.last.a, "", false, action);
      const ok = await askConfirm(action);
      const said = ok === true ? "Done. " + action.label : `That did not go through. ${ok}`;
      liveHistory(q, said); liveSay(said); return;
    }
    live.pending = null; askDropAction();   // anything else is a new question; the change is dropped
  }
  liveSet("thinking", q);
  askPanel(q, "Looking through the records…", "", true);
  if (live.mode === "rtc") rtcThink("Checking the office records for: " + q);
  let answer, action = null, went = "";
  try {
    const r = await fetch(pUrl(state.slug, "/ask"), { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ question: q, where: askWhere(), history: live.history.slice(-6), spoken: true, conversation_id: askState.conv }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.detail || "Closeout could not answer that just now");
    askAdopt(j);
    answer = j.answer; action = j.action || null;
    went = action ? "" : applyGo(j.go);
  } catch (e) { answer = e.message || "Closeout could not answer that just now; ask again"; }
  if (!live.on) return;
  askPanel(q, answer, went, false, action);
  live.last = { q, a: answer };
  liveHistory(q, answer);
  live.pending = action;
  liveSay(answer + (action ? ` ${action.label}. Say yes to confirm, or no.` : ""));
}
function liveHistory(q, a) { live.history.push({ q, a }); if (live.history.length > 12) live.history.shift(); }

/* The spoken conversation: the browser opens a real-time voice call to the server's voice service. The voice hears
   and speaks; every project question it receives is handed back here ("delegated"), answered by Closeout through
   /ask, and the answer is passed to the voice to say. The key never reaches the phone; the server opens the call. */
const rtc = { pc: null, dc: null, mic: null, out: null, heard: [], said: "", lastEnd: 0, started: false, delegation: null, quiet: null, muted: false, seq: 0 };
function rtcSend(ev) { try { if (rtc.dc && rtc.dc.readyState === "open") { ev.event_id = "co_" + (++rtc.seq); rtc.dc.send(JSON.stringify(ev)); } } catch (e) {} }
function rtcThink(text) { rtcSend({ type: "session.thinking.append", delegation_id: rtc.delegation, content: String(text).slice(0, 1200) }); }
function rtcSay(text) {
  const t = String(text || "").trim(); if (!t) return;
  for (let i = 0; i < t.length; i += 1200) rtcSend({ type: "session.commentary.append", delegation_id: rtc.delegation, content: t.slice(i, i + 1200) });
}
function rtcHangUp(pc, dc) { try { dc && dc.close(); } catch (e) {} try { pc && pc.close(); } catch (e) {} }
function rtcClose() {
  const { pc, dc, mic, out } = rtc;
  try { rtcSend({ type: "session.close" }); } catch (e) {}
  if (dc) {   // the call ends when the service says so, or after a moment either way
    const t = setTimeout(() => rtcHangUp(pc, dc), 3000);
    dc.onmessage = m => { try { if (JSON.parse(m.data).type === "session.closed") { clearTimeout(t); rtcHangUp(pc, dc); } } catch (e) {} };
  } else rtcHangUp(pc, dc);
  try { mic && mic.getTracks().forEach(t => t.stop()); } catch (e) {}
  try { if (out) { out.pause(); out.srcObject = null; } } catch (e) {}
  rtc.pc = null; rtc.dc = null; rtc.mic = null; rtc.started = false; rtc.delegation = null; rtc.heard = []; rtc.said = ""; rtc.muted = false;
  if (rtc.quiet) { clearTimeout(rtc.quiet); rtc.quiet = null; }
}
async function rtcEvent(ev) {
  if (!live.on || live.mode !== "rtc") return;
  switch (ev.type) {
    case "session.started":
      rtc.started = true; liveSet("listening", "Ask about the project"); break;
    case "session.input_transcript.delta":
      if (rtc.said || (ev.start_ms || 0) - rtc.lastEnd > 2500) { rtc.said = ""; rtc.heard = []; }   // a new utterance begins
      rtc.lastEnd = ev.end_ms || ev.start_ms || 0;
      rtc.heard.push({ t: String(ev.delta || ""), s: ev.start_ms || 0 });
      if (live.state !== "thinking") liveSet("listening", rtc.heard.map(h => h.t).join("").trim());
      break;
    case "session.output_transcript.delta":
      rtc.said += String(ev.delta || "");
      liveSet("speaking", rtc.said.trim());
      if (rtc.quiet) clearTimeout(rtc.quiet);
      rtc.quiet = setTimeout(() => { if (live.on && live.mode === "rtc" && live.state === "speaking") liveSet(rtc.muted ? "tap" : "listening", rtc.muted ? "Tap the circle to unmute" : "Listening"); }, 1800);
      break;
    case "session.delegation.created": {
      rtc.delegation = (ev.delegation && ev.delegation.id) || null;
      await new Promise(r => setTimeout(r, 350));   // let the last words of the transcript arrive
      const q = rtc.heard.map(h => h.t).join("").replace(/\s+/g, " ").trim(); rtc.heard = [];
      if (!q) { rtcSay("I did not catch that. Could you say it again?"); break; }
      liveHeard(q); break;
    }
    case "session.input_audio.muted": rtc.muted = true; liveSet("tap", "Tap the circle to unmute"); break;
    case "session.input_audio.unmuted": rtc.muted = false; liveSet("listening", "Ask about the project"); break;
    case "session.closed":
      if (live.on) { const why = ev.reason === "expired" ? "The conversation timed out" : "The conversation ended"; liveEnd(); toast(why); }
      break;
    case "error":
      console.warn("live voice", ev); break;
  }
}
async function rtcStart() {
  liveSet("thinking", "Connecting…");
  let mic;
  try { mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
  catch (e) { live.denied = true; toast("Allow the microphone in the browser to talk with Closeout", true); return false; }
  const pc = new RTCPeerConnection();
  rtc.pc = pc; rtc.mic = mic; rtc.heard = []; rtc.said = ""; rtc.started = false;
  mic.getTracks().forEach(t => pc.addTrack(t, mic));
  if (!rtc.out) { rtc.out = new Audio(); rtc.out.autoplay = true; rtc.out.setAttribute("playsinline", ""); }
  pc.ontrack = ev => { rtc.out.srcObject = ev.streams[0]; rtc.out.play().catch(() => {}); };
  const dc = pc.createDataChannel("oai-events"); rtc.dc = dc;
  dc.onmessage = m => { try { rtcEvent(JSON.parse(m.data)); } catch (e) {} };
  pc.onconnectionstatechange = () => { if (["failed", "closed", "disconnected"].includes(pc.connectionState) && live.on && live.mode === "rtc" && rtc.started) { liveEnd(); toast("The conversation dropped; tap Talk to start again", true); } };
  try {
    const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
    const r = await fetch(pUrl(state.slug, "/live/session"), { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ sdp: offer.sdp }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.sdp) throw new Error(j.detail || "could not start");
    await pc.setRemoteDescription({ type: "answer", sdp: j.sdp });
    await new Promise((res, rej) => { const t = setTimeout(() => rej(new Error("slow")), 15000); const tick = () => { if (rtc.started) { clearTimeout(t); res(); } else if (!live.on) { clearTimeout(t); rej(new Error("ended")); } else setTimeout(tick, 100); }; tick(); });
    return true;
  } catch (e) { rtcClose(); return false; }
}
async function liveStart() {
  if (live.on) return;
  live.on = true; live.history = []; live.pending = null; live.misses = 0; live.denied = false; live.mode = "phone";
  $("#askbar").classList.add("live");
  try { window.speechSynthesis.getVoices(); } catch (e) {}
  liveUnlockAudio(); await voiceStatus();
  if (!live.on) return;
  if (live.rtcOk && window.RTCPeerConnection && navigator.mediaDevices) {
    live.mode = "rtc";
    if (await rtcStart()) return;
    if (!live.on) return;
    live.mode = "phone";
    if (!live.denied && SR) toast("The spoken conversation did not connect; using the phone's own voice");
  }
  if (!SR || live.denied) { liveEnd(); if (!live.denied) toast("This browser cannot listen; type the question instead", true); return; }
  liveListen();
}
function liveEnd() {
  const was = live.mode;
  live.on = false; live.pending = null;
  try { if (live.rec) live.rec.abort(); } catch (e) {} live.rec = null;
  liveHush();
  if (was === "rtc") rtcClose();
  live.mode = "phone";
  $("#askbar").classList.remove("live"); liveSet("tap", "Closeout is listening for a question");
}
if (SR || (window.RTCPeerConnection && navigator.mediaDevices)) {
  /* The hands-free loop on the phone's own voice keeps its own button; once the spoken conversation is set up
     the microphone button opens it, so that button is put away. */
  voiceStatus().then(() => { $("#asklive").hidden = !!liveReady(); $("#askmic").setAttribute("aria-label", liveReady() ? "Talk with Closeout" : "Speak"); });
  $("#asklive").hidden = false;
  $("#asklive").onclick = liveStart;
  $("#liveend").onclick = liveEnd;
  $("#liveorb").onclick = () => {
    if (!live.on) return;
    if (live.mode === "rtc") {   // on a call the circle mutes and unmutes the microphone
      if (!rtc.started) return;
      rtcSend({ type: rtc.muted ? "session.input_audio.unmute" : "session.input_audio.mute" });
      return;
    }
    if (live.state === "listening") { try { live.rec && live.rec.stop(); } catch (e) {} return; }   // send what was heard
    if (live.state === "thinking") return;
    liveHush();   // interrupt the answer, or wake from "tap"
    live.speaking = null; live.misses = 0; liveListen();
  };
}
</script>
