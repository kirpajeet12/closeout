<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Closeout</title>
<style>
  :root {
    --paper: #f7f4ed; --card: #ffffff; --ink: #121314; --ink-2: #3a3d42; --mute: #74787f; --line: #e6e1d6; --line-2: #d3cdbf;
    --ready: #178a4c; --ready-bg: #e3f4ea; --needs: #b45309; --needs-bg: #fdecd8; --unclear: #5b5f66; --unclear-bg: #e9e7e1;
    --none: #9a9ea6; --none-bg: #f0eee8; --hot: #e8590c; --link: #1b5fd6;
    --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    --sans: -apple-system, "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: var(--link); text-decoration: none; } a:hover { text-decoration: underline; }
  button { font: inherit; cursor: pointer; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 28px 80px; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 22px 0 16px; border-bottom: 1px solid var(--line); gap: 20px; }
  .wordmark { font-weight: 800; letter-spacing: .2em; font-size: 12px; text-transform: uppercase; white-space: nowrap; }
  .wordmark a { color: inherit; }
  .crumbs { font-size: 14px; color: var(--mute); display: flex; gap: 8px; align-items: center; min-width: 0; }
  .crumbs b { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crumbs span { white-space: nowrap; }

  /* projects home */
  .homehead { display: flex; align-items: flex-end; justify-content: space-between; padding: 40px 0 20px; gap: 20px; }
  .homehead h1 { margin: 0; font-size: 34px; letter-spacing: -.02em; }
  .homehead p { margin: 6px 0 0; color: var(--mute); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .pcard { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px 22px 18px; cursor: pointer; display: flex; flex-direction: column; gap: 10px; min-height: 190px; transition: border-color .15s, transform .15s; position: relative; }
  .pcard:hover { border-color: var(--ink); transform: translateY(-1px); }
  .pcard h2 { margin: 0; font-size: 20px; letter-spacing: -.01em; line-height: 1.25; }
  .pcard .addr { color: var(--mute); font-size: 13px; min-height: 20px; }
  .pcard .big { font-size: 40px; font-weight: 700; letter-spacing: -.03em; line-height: 1; margin-top: auto; }
  .pcard .big small { font-size: 14px; font-weight: 500; letter-spacing: 0; color: var(--ink-2); margin-left: 8px; }
  .pcard .meta { display: flex; gap: 14px; flex-wrap: wrap; color: var(--mute); font-size: 12px; margin-top: 4px; }
  .pcard .live { position: absolute; top: 18px; right: 18px; width: 10px; height: 10px; border-radius: 50%; background: var(--hot); animation: pulse 1s infinite alternate; }
  .bar { display: flex; height: 8px; border-radius: 6px; overflow: hidden; background: var(--none-bg); }
  .bar i { display: block; height: 100%; }
  .bar .ready { background: var(--ready); } .bar .needs { background: var(--needs); } .bar .unclear { background: var(--unclear); }
  .newp { border: 2px dashed var(--line-2); background: transparent; border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 12px; justify-content: center; min-height: 190px; position: relative; transition: border-color .15s, background .15s; }
  .newp.over { border-color: var(--hot); background: #fff6ef; }
  .newp h2 { margin: 0; font-size: 16px; }
  .newp p { margin: 0; color: var(--mute); font-size: 13px; }
  .newp form { display: flex; gap: 8px; }
  .newp input[type=text] { flex: 1; font: inherit; border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 12px; background: #fff; min-width: 0; }
  .newp button { border: 1px solid var(--ink); background: var(--ink); color: #fff; border-radius: 10px; padding: 9px 14px; font-weight: 600; }
  .newp .or { position: relative; border-top: 1px solid var(--line); margin: 4px 0; }
  .newp .or span { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); background: var(--paper); padding: 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--mute); }
  .newp .folder { position: relative; text-align: center; padding: 8px; border-radius: 10px; font-size: 13px; color: var(--ink-2); }
  .newp .folder input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .newp.over .folder, .newp .folder:hover { background: #fff; }

  /* project page */
  .phead { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; padding: 30px 0 0; }
  .phead h1 { margin: 0; font-size: 30px; letter-spacing: -.02em; line-height: 1.2; }
  .phead .sub { color: var(--mute); margin-top: 4px; font-size: 14px; }
  .phead .btn { white-space: nowrap; }
  .tabs { display: flex; gap: 4px; margin-top: 22px; border-bottom: 1px solid var(--line); }
  .tabs a { padding: 10px 14px; color: var(--mute); font-weight: 600; font-size: 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs a:hover { text-decoration: none; color: var(--ink); }
  .tabs a.on { color: var(--ink); border-bottom-color: var(--ink); }
  .tabs a small { font-weight: 500; color: var(--mute); margin-left: 6px; font-size: 12px; }

  .hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 28px; align-items: stretch; padding: 30px 0 22px; }
  .count { font-size: clamp(56px, 8vw, 96px); font-weight: 700; line-height: .95; letter-spacing: -.03em; margin: 0; }
  .count small { display: block; font-size: 20px; font-weight: 500; letter-spacing: 0; color: var(--ink-2); margin-top: 12px; }
  .hero .bar { height: 10px; margin-top: 26px; }
  .legend { display: flex; gap: 18px; margin-top: 12px; font-size: 13px; color: var(--mute); flex-wrap: wrap; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }

  .drop { position: relative; border: 2px dashed var(--line-2); border-radius: 18px; background: var(--card); display: flex; flex-direction: column;
          justify-content: center; align-items: center; text-align: center; padding: 34px 28px; min-height: 230px; transition: border-color .15s, background .15s; }
  .drop.over { border-color: var(--hot); background: #fff6ef; }
  .drop.big .arrow { width: 48px; height: 48px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 22px; margin-bottom: 14px; }
  .drop h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: -.01em; }
  .drop p { margin: 0; color: var(--mute); font-size: 14px; max-width: 34ch; }
  .drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .drop.small { min-height: 0; padding: 18px 20px; flex-direction: row; gap: 14px; text-align: left; justify-content: flex-start; }
  .drop.small h2 { font-size: 15px; margin: 0; } .drop.small p { font-size: 13px; max-width: none; }
  .drops { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }

  .status { display: flex; align-items: center; gap: 12px; padding: 14px 18px; margin: 14px 0 0; border-radius: 12px; background: var(--card); border: 1px solid var(--line); font-size: 14px; }
  .status .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--none); flex: none; }
  .status.run .dot { background: var(--hot); animation: pulse 1s infinite alternate; }
  .status.ok .dot { background: var(--ready); } .status.bad .dot { background: var(--needs); }
  @keyframes pulse { from { opacity: .35 } to { opacity: 1 } }
  .status .fill { flex: 1; }
  .status .mono { font-family: var(--mono); font-size: 12px; color: var(--mute); }
  .status button, .btn { border: 1px solid var(--line-2); background: var(--card); border-radius: 8px; padding: 6px 12px; font-size: 13px; color: var(--ink); }
  .status button:hover, .btn:hover { border-color: var(--ink); text-decoration: none; }

  h3.sec { font-size: 13px; text-transform: uppercase; letter-spacing: .14em; color: var(--mute); margin: 40px 0 12px; font-weight: 600; }

  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  th, td { text-align: left; padding: 14px 16px; border-top: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--mute); font-weight: 600; border-top: 0; background: #fbfaf6; }
  tr.row { cursor: pointer; } tr.row:hover td { background: #fbfaf6; }
  td.id { font-family: var(--mono); font-size: 13px; color: var(--ink-2); white-space: nowrap; width: 1%; }
  td .what { font-weight: 600; } td .where { color: var(--mute); font-size: 13px; margin-top: 2px; }
  td.st { width: 1%; white-space: nowrap; } td.call { width: 18%; color: var(--mute); font-size: 13px; }
  td.go { width: 1%; color: var(--mute); }
  td.num { font-family: var(--mono); font-size: 13px; white-space: nowrap; }
  .pill { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
  .pill.ready { color: var(--ready); background: var(--ready-bg); } .pill.needs { color: var(--needs); background: var(--needs-bg); }
  .pill.unclear { color: var(--unclear); background: var(--unclear-bg); } .pill.none { color: var(--none); background: var(--none-bg); }
  .pill.lg { font-size: 14px; padding: 7px 14px; }

  .left { display: grid; gap: 10px; }
  .left .card { display: grid; grid-template-columns: 72px 1fr; gap: 14px; padding: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  .thumb { width: 72px; height: 72px; border-radius: 8px; overflow: hidden; background: #eee9dd; display: grid; place-items: center; color: var(--mute); font-family: var(--mono); font-size: 11px; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .file { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
  .card p { margin: 4px 0 0; font-size: 14px; color: var(--ink-2); }
  .empty { color: var(--mute); padding: 14px 0; }

  /* drawings tab */
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-top: 18px; }
  .sheet { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: pointer; transition: border-color .15s; }
  .sheet:hover { border-color: var(--ink); }
  .sheet img { width: 100%; aspect-ratio: 1.4; object-fit: cover; object-position: top left; display: block; background: #fff; border-bottom: 1px solid var(--line); }
  .sheet .cap { padding: 10px 12px; }
  .sheet .cap b { display: block; font-family: var(--mono); font-size: 12px; }
  .sheet .cap span { display: block; font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sheet .cap small { color: var(--mute); font-size: 12px; }
  .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-top: 22px; }
  .fact { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .fact b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--mute); font-weight: 600; margin-bottom: 4px; }
  .fact span { font-size: 15px; }

  /* messages tab */
  .msg { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 22px; margin-top: 12px; }
  .msg .top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; font-size: 13px; color: var(--mute); }
  .msg h4 { margin: 6px 0 8px; font-size: 16px; }
  .msg pre { white-space: pre-wrap; font: inherit; margin: 0; color: var(--ink-2); }

  footer { margin-top: 44px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--mute); font-size: 13px; display: flex; gap: 22px; flex-wrap: wrap; }

  /* item page */
  .back { display: inline-block; margin: 24px 0 8px; color: var(--mute); font-size: 14px; }
  .item-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; padding-bottom: 22px; }
  .item-head h1 { margin: 0; font-size: 30px; letter-spacing: -.02em; line-height: 1.2; }
  .item-head .where { color: var(--mute); margin-top: 6px; font-size: 15px; }
  .item-head .idm { font-family: var(--mono); font-size: 13px; color: var(--mute); margin-bottom: 6px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  section.box { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px; margin-top: 22px; }
  section.box h2 { margin: 0 0 14px; font-size: 13px; text-transform: uppercase; letter-spacing: .14em; color: var(--mute); font-weight: 600; }
  .asked li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .asked li:first-child { border-top: 0; }
  .asked ul { list-style: none; padding: 0; margin: 0; }
  .tick { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; }
  .tick.yes { background: var(--ready-bg); color: var(--ready); } .tick.no { background: var(--needs-bg); color: var(--needs); } .tick.maybe { background: var(--unclear-bg); color: var(--unclear); }
  .sent .card { grid-template-columns: 120px 1fr; }
  .sent .thumb { width: 120px; height: 120px; }
  .sent .how { font-size: 13px; margin-top: 6px; }
  .sent .how b { font-weight: 700; }
  .sent .how.sure b { color: var(--ready); } .sent .how.unsure b { color: var(--needs); }
  .sent .open { font-size: 13px; margin-top: 6px; }
  .obs { margin-top: 6px; font-size: 13px; color: var(--mute); } .obs summary { cursor: pointer; } .obs ul { margin: 6px 0 0; padding-left: 18px; } .obs li { margin: 2px 0; }
  .refs { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .refs figure { margin: 0; } .refs img { width: 100%; border-radius: 10px; border: 1px solid var(--line); display: block; background: #fff; }
  .refs figcaption { font-size: 13px; color: var(--mute); margin-top: 6px; }
  .call .btns { display: flex; gap: 10px; flex-wrap: wrap; }
  .call .btns button { padding: 12px 18px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--card); font-weight: 600; font-size: 15px; }
  .call .btns button.accept { background: var(--ink); color: #fff; border-color: var(--ink); }
  .call .btns button.on { outline: 3px solid var(--hot); outline-offset: 2px; }
  .call textarea, .call input { width: 100%; font: inherit; border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px; background: #fff; }
  .call textarea { min-height: 150px; resize: vertical; }
  .call label { display: block; font-size: 12px; color: var(--mute); text-transform: uppercase; letter-spacing: .1em; margin: 16px 0 6px; }
  .call .note { margin-top: 14px; }
  .decided { margin-top: 14px; font-size: 14px; color: var(--ink-2); }
  .decided b { color: var(--ink); }
  .hist { margin-top: 10px; font-size: 13px; color: var(--mute); }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: .2s; pointer-events: none; z-index: 9; }
  .toast.show { opacity: 1; transform: translateX(-50%); } .toast.err { background: var(--hot); }
  @media (max-width: 760px) { .hero, .grid2, .drops, .refs { grid-template-columns: 1fr; } .wrap { padding: 0 16px 60px; } .tabs { overflow-x: auto; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="wordmark"><a href="#/">Closeout</a></div>
    <div class="crumbs" id="crumbs"></div>
  </header>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const when = s => { const d = new Date(s); return isNaN(d) ? String(s ?? "") : d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }); };
const fileUrl = (id, page) => `/api/evidence/${id}/file` + (page ? `#page=${page}` : "");
const isImg = name => /\.(jpe?g|png|heic|heif|webp)$/i.test(name || "");
const PRICE = { inputTokens: 3 / 1e6, outputTokens: 15 / 1e6 };
const cost = r => { const u = JSON.parse((r && r.usage_json) || "{}"); return (u.inputTokens || 0) * PRICE.inputTokens + (u.outputTokens || 0) * PRICE.outputTokens; };
const state = { home: null, p: null, slug: null, es: null, run: { kind: "idle", text: "", done: 0, total: 0 } };

function toast(msg, err) { const t = $("#toast"); t.textContent = msg; t.className = "toast show" + (err ? " err" : ""); setTimeout(() => t.className = "toast", 3200); }
function route() {
  const h = location.hash.replace(/^#\/?/, "");
  let m = h.match(/^p\/([^/]+)\/item\/(.+)$/); if (m) return { page: "item", slug: m[1], id: decodeURIComponent(m[2]) };
  m = h.match(/^p\/([^/]+)\/?(drawings|evidence|messages)?$/); if (m) return { page: "project", slug: m[1], tab: m[2] || "list" };
  return { page: "home" };
}
const pUrl = (slug, tail) => `/api/projects/${encodeURIComponent(slug)}${tail || ""}`;
const pHash = (slug, tail) => `#/p/${encodeURIComponent(slug)}${tail || ""}`;

/* ---- plain-English status ---------------------------------------------- */
function status(i) {
  if (i.completeness === "complete") return { k: "ready", t: "Ready ✓" };
  if (i.completeness === "incomplete") { const t = [...new Set(i.missing_slots.map(m => m.type))]; return { k: "needs", t: "Needs " + t.join(" + ") }; }
  if (i.completeness === "needs_clarification") return { k: "unclear", t: "Unclear" };
  return { k: "none", t: "Nothing yet" };
}
const CALL = { accept: "Ready to close", reject: "Not accepted", hold: "On hold" };
function items() {
  const p = state.p, pk = p.packet;
  return pk ? pk.items : p.register.map(d => ({ item: d, completeness: "no_evidence", evidence: [], unresolved: [], missing_slots: d.slots, history: [], followup_draft: null, decision: null }));
}

/* ---- data ----------------------------------------------------------- */
async function load() {
  const r = route();
  if (r.page === "home") {
    state.home = await (await fetch("/api/projects")).json();
    if (state.home.active_run_id && !state.es) follow(state.home.active_run_id);
  } else {
    const res = await fetch(pUrl(r.slug));
    if (!res.ok) { state.p = null; state.slug = r.slug; render(); return; }
    state.p = await res.json(); state.slug = r.slug;
    if (state.p.active_run_id && !state.es) follow(state.p.active_run_id);
  }
  render();
}
function render() {
  const r = route(), p = state.p;
  const inP = r.page !== "home" && p;
  $("#crumbs").innerHTML = inP ? `<a href="#/">Projects</a><span>›</span><b>${esc(p.project.name)}</b>${r.page === "item" ? `<span>›</span><span>${esc(r.id)}</span>` : ""}` : `<span>${state.home ? `${state.home.projects.length} project${state.home.projects.length === 1 ? "" : "s"}` : ""}</span>`;
  if (r.page === "home") renderHome();
  else if (!p) $("#main").innerHTML = `<a class="back" href="#/">← Projects</a><p class="empty">No project called “${esc(r.slug)}”.</p>`;
  else if (r.page === "item") renderItem(r.id);
  else renderProject(r.tab);
}

/* ---- projects home --------------------------------------------------- */
function renderHome() {
  const h = state.home, list = h.projects;
  $("#main").innerHTML = `
    <div class="homehead"><div><h1>Projects</h1><p>${list.length ? "Open a project to review its deficiencies, drawings and the evidence contractors sent." : "Start with a project: give it a name, or drop the project folder with the drawings."}</p></div></div>
    <div class="status ${esc(state.run.kind)}" id="status" ${state.run.kind === "idle" ? "hidden" : ""}></div>
    <div class="cards" style="margin-top:18px">
      ${list.map(c => { const pct = k => c.items ? (c[k] / c.items * 100) + "%" : "0%"; return `
      <div class="pcard" data-slug="${esc(c.slug)}">
        ${c.active ? `<span class="live" title="Agent is working"></span>` : ""}
        <h2>${esc(c.name)}</h2>
        <div class="addr">${esc([c.address, c.city].filter(Boolean).join(", ") || (c.sheets ? "" : "No drawings yet"))}</div>
        <div class="big">${c.ready}<small>of ${c.items} ready to close</small></div>
        <div class="bar"><i class="ready" style="width:${pct("ready")}"></i><i class="needs" style="width:${pct("needs")}"></i><i class="unclear" style="width:${pct("unclear")}"></i></div>
        <div class="meta"><span>${c.sheets} sheets</span><span>${c.items} deficiencies</span><span>${c.drops} evidence drop${c.drops === 1 ? "" : "s"}</span><span>${c.last_activity ? "updated " + esc(when(c.last_activity)) : ""}</span></div>
      </div>`; }).join("")}
      <div class="newp" id="newp">
        <h2>New project</h2>
        <form id="newForm"><input type="text" id="newName" placeholder="Project name, e.g. Maple Court" autocomplete="off"><button type="submit">Create</button></form>
        <div class="or"><span>or</span></div>
        <div class="folder">Drop the project folder here<br><small style="color:var(--mute)">The agent reads every current sheet and names the project from the title block.</small><input type="file" webkitdirectory multiple></div>
      </div>
    </div>
    <footer><span>Nothing here is an engineering determination. The engineer decides.</span>${h.model_id ? `<span>Agents run on ${esc(h.model_id.replace(/^us\./, ""))}</span>` : ""}</footer>`;

function sentCard(f, unresolved) {
  let how, cls = "sure";
  if (unresolved) {
    cls = "unsure";
    how = f.kind === "weak_match" ? "Fits this item, but nothing on the file confirms where it was taken" : f.kind === "ambiguous" ? `Could be ${(f.candidates || []).join(" or ")}` : `Says it is somewhere else (${(f.flags || []).includes("conflicting_reference") ? "its own label contradicts the list" : "conflict"})`;
  } else {
    const fl = f.flags || [];
    how = f.tier === "explicit" ? "Named on the file or in the note" : f.tier === "strong" ? (fl.includes("location_by_reference") ? "Same spot as the engineer's photo" : fl.includes("location_from_sequence") ? "Taken right after a photo that names the place" : "Place and scope both on the file") : "Location not confirmed";
    if (f.tier === "weak") cls = "unsure";
  }
  const obs = (f.observations || []).filter(o => o.text).map(o => o.text);
  const src = (f.sources || []).map(s => `<a href="${fileUrl(s.evidence_id, s.page)}" target="_blank">open${s.page ? ` page ${s.page}` : ""}</a>`).join(" · ");
  return `<div class="card"><div class="thumb">${isImg(f.filename) ? `<img src="${fileUrl(f.evidence_id)}" alt="">` : esc((f.filename || "").split(".").pop().toUpperCase())}</div>
    <div><div class="file">${esc(f.filename)}</div>
      <div class="how ${cls}"><b>${esc(how)}</b>${!unresolved && f.slot_index >= 0 ? ` · fills “${esc(slotName(f))}”` : ""}</div>
      <p>${esc(f.rationale)}</p>${obs.length ? `<details class="obs"><summary>${obs.length} things the agent saw in the ${isImg(f.filename) ? "photo" : "file"}</summary><ul>${obs.map(o => `<li>${esc(o)}</li>`).join("")}</ul></details>` : ""}
      <div class="open">${src}</div></div></div>`;
}
function dedupe(hist) {
  const out = []; let last = "";
  for (const h of hist) { const k = h.run_started_at + "|" + h.completeness; if (k !== last) out.push(h); last = k; }
  return out;
}
function slotName(f) {
  const i = items().find(x => x.evidence.some(e => e.finding_id === f.finding_id));
  const sl = i && i.item.slots[f.slot_index];
  return sl ? sl.type : "";
}

/* ---- live run feed --------------------------------------------------- */
function follow(runId, onDone) {
  if (state.es) state.es.close();
  state.run = { kind: "run", text: "Starting…", done: 0, total: 0 }; renderStatus();
  const es = new EventSource(`/api/runs/${runId}/events`);
  state.es = es;
  const onAny = ev => {
    const e = JSON.parse(ev.data), d = e.data || {};
    switch (e.event) {
      case "uploaded": state.run.text = `Uploaded ${d.files} files. Checking them…`; break;
      case "ingested": state.run.text = `${d.new} new files, ${d.existing} already on record.`; break;
      case "project_scanned": state.run.text = `Found ${d.documents} documents. Rendering the current sheets…`; break;
      case "sheet_rendered": state.run.text = `Rendering ${d.discipline} page ${d.page} of ${d.of}…`; break;
      case "jobs_created": state.run.total = d.match_jobs || d.sheet_jobs || 0; state.run.done = 0; state.run.text = `Agent is reading ${state.run.total} ${d.sheet_jobs ? "sheets" : "files"}…`; break;
      case "job_start": if (d.kind === "draft") state.run.text = `Drafting the message for ${d.item_id}…`; else if (d.kind === "project_summary") state.run.text = "Summarising the project…"; else state.run.text = `Reading ${d.label || d.filename}…`; break;
      case "job_done": if (d.kind !== "draft" && d.kind !== "project_summary") state.run.done++; break;
      case "job_failed": state.run.text = `Could not read ${d.label || d.filename || d.item_id}: ${d.error}`; break;
      case "completeness": state.run.text = "Checking what each item still needs…"; break;
      case "packet": case "project_ready": case "run_error":
        es.close(); state.es = null;
        const bad = e.event === "run_error" || d.failed_jobs > 0 || d.status === "failed";
        state.run = { kind: bad ? "bad" : "ok", text: e.event === "run_error" ? `Run error: ${d.error}` : bad ? `Finished, but ${d.failed_jobs} part(s) failed.` : e.event === "project_ready" ? `Project read: ${d.name}.` : "Done. Every file has been filed.", done: 0, total: 0 };
        if (onDone) onDone(e.event, d); else load();
        return;
    }
    renderStatus();
    if (e.event === "completeness" || e.event === "job_done") load();
  };
  ["uploaded", "ingested", "project_scanned", "sheet_rendered", "sheets_ready", "jobs_created", "job_start", "job_done", "job_failed", "completeness", "packet", "project_ready", "run_error", "retry"].forEach(k => es.addEventListener(k, onAny));
  es.onerror = () => { if (state.es === es) { es.close(); state.es = null; state.run = { kind: "bad", text: "Lost the connection to the run.", done: 0, total: 0 }; load(); } };
}

/* ---- folder drops ---------------------------------------------------- */
async function walk(entry, prefix, out) {
  if (entry.isFile) { const f = await new Promise((res, rej) => entry.file(res, rej)); out.push({ file: f, path: prefix + entry.name }); }
  else if (entry.isDirectory) {
    const reader = entry.createReader(); let batch;
    do { batch = await new Promise((res, rej) => reader.readEntries(res, rej)); for (const e of batch) if (!e.name.startsWith(".")) await walk(e, prefix + entry.name + "/", out); } while (batch.length);
  }
}
async function filesFromDrop(dt, keepTop) {
  const out = [];
  const entries = [...dt.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (entries.length) { for (const e of entries) await walk(e, "", out); }
  else for (const f of dt.files) out.push({ file: f, path: f.name });
  const top = new Set(out.map(o => o.path.split("/")[0]));
  if (!keepTop && top.size === 1 && out.every(o => o.path.includes("/"))) out.forEach(o => o.path = o.path.split("/").slice(1).join("/"));
  return out.filter(o => !o.path.split("/").some(p => p.startsWith(".")));
}
function filesFromInput(input, keepTop) {
  return [...input.files].map(f => ({ file: f, path: keepTop ? (f.webkitRelativePath || f.name) : ((f.webkitRelativePath || f.name).split("/").slice(1).join("/") || f.name) })).filter(o => !o.path.split("/").some(p => p.startsWith(".")));
}
async function send(kind, slug, items, label) {
  if (!items.length) return toast("Nothing to upload", true);
  const fd = new FormData();
  items.forEach(o => { fd.append("files", o.file, o.file.name); fd.append("paths", o.path); });
  if (kind === "batch" && label) fd.append("label", label);
  if (kind === "project") fd.append("slug", (label || "project").toLowerCase().replace(/[^a-z0-9]+/g, "-"));
  toast(`Uploading ${items.length} files…`);
  const url = kind === "project" ? "/api/projects" : pUrl(slug, { batch: "/batches", register: "/register", drawings: "/drawings" }[kind]);
  const r = await fetch(url, { method: "POST", body: fd });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) return toast(j.detail || `Upload failed (${r.status})`, true);
  if (kind === "register") { toast(`Deficiency list loaded: ${j.imported} items`); load(); }
  else if (kind === "project") { load(); follow("pending", () => { location.hash = pHash(j.slug); load(); }); }
  else follow("pending");
}
function wireDrop(el, kind, slug) {
  if (!el) return;
  const input = $("input[type=file]", el), keepTop = kind === "project" || kind === "drawings";
  el.addEventListener("dragover", e => { e.preventDefault(); el.classList.add("over"); });
  el.addEventListener("dragleave", () => el.classList.remove("over"));
  el.addEventListener("drop", async e => { e.preventDefault(); el.classList.remove("over"); const items = await filesFromDrop(e.dataTransfer, keepTop); const ent = e.dataTransfer.items[0] && e.dataTransfer.items[0].webkitGetAsEntry && e.dataTransfer.items[0].webkitGetAsEntry(); send(kind, slug, items, ent ? ent.name : null); });
  input.addEventListener("change", () => { const items = filesFromInput(input, keepTop); const label = input.files[0] && input.files[0].webkitRelativePath ? input.files[0].webkitRelativePath.split("/")[0] : null; send(kind, slug, items, label); input.value = ""; });
}

window.addEventListener("hashchange", () => { if (route().page === "home" && state.p) { state.p = null; } load(); });
load();
</script>
