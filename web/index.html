<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Closeout</title>
<style>
  :root {
    --paper: #f7f4ed; --card: #ffffff; --ink: #121314; --ink-2: #3a3d42; --mute: #74787f; --line: #e6e1d6; --line-2: #d3cdbf;
    --ready: #178a4c; --ready-bg: #e3f4ea; --needs: #b45309; --needs-bg: #fdecd8; --unclear: #5b5f66; --unclear-bg: #e9e7e1;
    --none: #9a9ea6; --none-bg: #f0eee8; --hot: #e8590c; --link: #1b5fd6;
    --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    --sans: -apple-system, "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: var(--link); text-decoration: none; } a:hover { text-decoration: underline; }
  button { font: inherit; cursor: pointer; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 28px 80px; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 22px 0 16px; border-bottom: 1px solid var(--line); gap: 20px; }
  .wordmark { font-weight: 800; letter-spacing: .2em; font-size: 12px; text-transform: uppercase; white-space: nowrap; }
  .wordmark a { color: inherit; }
  .crumbs { font-size: 14px; color: var(--mute); display: flex; gap: 8px; align-items: center; min-width: 0; }
  .crumbs b { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crumbs span { white-space: nowrap; }

  /* projects home */
  .homehead { display: flex; align-items: flex-end; justify-content: space-between; padding: 40px 0 20px; gap: 20px; }
  .homehead h1 { margin: 0; font-size: 34px; letter-spacing: -.02em; }
  .homehead p { margin: 6px 0 0; color: var(--mute); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .pcard { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px 22px 18px; cursor: pointer; display: flex; flex-direction: column; gap: 10px; min-height: 190px; transition: border-color .15s, transform .15s; position: relative; }
  .pcard:hover { border-color: var(--ink); transform: translateY(-1px); }
  .pcard h2 { margin: 0; font-size: 20px; letter-spacing: -.01em; line-height: 1.25; }
  .pcard .addr { color: var(--mute); font-size: 13px; min-height: 20px; }
  .pcard .big { font-size: 40px; font-weight: 700; letter-spacing: -.03em; line-height: 1; margin-top: auto; }
  .pcard .big small { font-size: 14px; font-weight: 500; letter-spacing: 0; color: var(--ink-2); margin-left: 8px; }
  .pcard .meta { display: flex; gap: 14px; flex-wrap: wrap; color: var(--mute); font-size: 12px; margin-top: 4px; }
  .pcard .facts { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 6px; font-size: 12px; color: var(--mute); }
  .pcard .facts b { display: block; font-size: 16px; color: var(--ink); letter-spacing: -.01em; line-height: 1.1; }
  /* overview */
  .ov { padding-top: 26px; }
  .ov-hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 28px; align-items: stretch; }
  .ov-hero .bar { height: 10px; margin-top: 26px; }
  .ov-next { background: var(--ink); color: #fff; border-radius: 18px; padding: 24px 26px; display: flex; flex-direction: column; justify-content: space-between; gap: 16px; min-height: 190px; }
  .ov-next .k { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: rgba(255,255,255,.55); font-weight: 700; }
  .ov-next h2 { margin: 8px 0 0; font-size: 26px; letter-spacing: -.02em; line-height: 1.15; }
  .ov-next p { margin: 10px 0 0; color: rgba(255,255,255,.72); font-size: 14px; max-width: 42ch; line-height: 1.45; }
  .ov-next a { color: #fff; font-weight: 600; font-size: 14px; align-self: flex-start; border-bottom: 1px solid rgba(255,255,255,.4); }
  .ov-next a:hover { text-decoration: none; border-bottom-color: #fff; } .ov-next a::after { content: " →"; }
  .ov-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-top: 22px; }
  .ov-card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px 22px 18px; display: flex; flex-direction: column; }
  .ov-card h3 { margin: 0 0 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--mute); font-weight: 700; }
  .ov-card .line { display: flex; justify-content: space-between; gap: 14px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .ov-card .line:first-of-type { border-top: 0; padding-top: 2px; }
  .ov-card .line b { font-weight: 600; } .ov-card .line > span { color: var(--ink-2); text-align: right; flex: none; max-width: 55%; }
  .ov-card .line small { display: block; color: var(--mute); font-weight: 400; font-size: 12px; margin-top: 2px; }
  .ov-card .empty { padding: 2px 0 8px; font-size: 14px; }
  .ov-card .more { display: block; margin-top: auto; padding-top: 12px; font-size: 13px; font-weight: 600; }
  /* deficiencies: where evidence comes from now */
  .inbox { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px 24px; display: flex; flex-direction: column; gap: 6px; }
  .inbox .k { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--hot); font-weight: 700; }
  .inbox h2 { margin: 2px 0 0; font-size: 22px; letter-spacing: -.01em; } .inbox p { margin: 0; color: var(--mute); font-size: 14px; max-width: 40ch; line-height: 1.45; }
  .inbox a { margin-top: auto; padding-top: 10px; font-weight: 600; font-size: 14px; } .inbox a::after { content: " →"; }
  /* messages: the contractor link */
  .msg .link { margin-top: 14px; padding: 14px 16px; border-radius: 12px; background: var(--paper); border: 1px solid var(--line); display: flex; justify-content: space-between; gap: 14px; align-items: center; flex-wrap: wrap; }
  .msg .link.on { border-color: var(--ready); background: var(--ready-bg); }
  .msg .link > div:first-child { flex: 1; min-width: 240px; } .msg .link b { display: block; font-size: 14px; }
  .msg .link small { display: block; color: var(--mute); font-size: 12px; margin-top: 4px; max-width: 60ch; }
  .msg .link input { width: 100%; margin-top: 6px; font: inherit; font-size: 13px; font-family: var(--mono); border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 10px; background: #fff; color: var(--ink); }
  .msg .link .acts { display: flex; gap: 8px; flex-wrap: wrap; } .msg .link .btn.quiet { color: var(--mute); border-color: transparent; }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  /* the contractor's page */
  body.contractor .wordmark a { pointer-events: none; }
  .ct { max-width: 760px; }
  .ct .ct-lead { color: var(--ink-2); font-size: 16px; line-height: 1.5; margin: 14px 0 20px; max-width: 60ch; }
  .ct .drop.big { min-height: 150px; }
  .ct .ct-pk { margin-top: 22px; border-top: 1px solid var(--line); }
  .ct .ct-pk .row { display: grid; grid-template-columns: 58px 1fr auto; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 15px; align-items: start; }
  .ct .ct-pk .row .id { font-family: var(--mono); font-weight: 700; color: var(--hot); }
  .ct .ct-pk .row small { display: block; color: var(--mute); margin-top: 3px; font-size: 13px; }
  @media (max-width: 760px) { .ov-hero { grid-template-columns: 1fr; } .ct .ct-pk .row { grid-template-columns: 52px 1fr; } .ct .ct-pk .row .pill { grid-column: 2; justify-self: start; } }
  .pcard .live { position: absolute; top: 18px; right: 18px; width: 10px; height: 10px; border-radius: 50%; background: var(--hot); animation: pulse 1s infinite alternate; }
  .bar { display: flex; height: 8px; border-radius: 6px; overflow: hidden; background: var(--none-bg); }
  .bar i { display: block; height: 100%; }
  .bar .ready { background: var(--ready); } .bar .needs { background: var(--needs); } .bar .unclear { background: var(--unclear); }
  .newp { border: 2px dashed var(--line-2); background: transparent; border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 12px; justify-content: center; min-height: 190px; position: relative; transition: border-color .15s, background .15s; }
  .newp.over { border-color: var(--hot); background: #fff6ef; }
  .newp h2 { margin: 0; font-size: 16px; }
  .newp p { margin: 0; color: var(--mute); font-size: 13px; }
  .newp form { display: flex; gap: 8px; }
  .newp input[type=text] { flex: 1; font: inherit; border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 12px; background: #fff; min-width: 0; }
  .newp button { border: 1px solid var(--ink); background: var(--ink); color: #fff; border-radius: 10px; padding: 9px 14px; font-weight: 600; }
  .newp .or { position: relative; border-top: 1px solid var(--line); margin: 4px 0; }
  .newp .or span { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); background: var(--paper); padding: 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--mute); }
  .newp .folder { position: relative; text-align: center; padding: 8px; border-radius: 10px; font-size: 13px; color: var(--ink-2); }
  .newp .folder input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .newp.over .folder, .newp .folder:hover { background: #fff; }
  .newp .np-k { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--hot); font-weight: 700; }
  .newp h2.np-t { font-size: 22px; letter-spacing: -.01em; line-height: 1.15; margin: 4px 0 0; }
  .newp .np-zip { position: relative; display: flex; flex-direction: column; gap: 2px; padding: 16px 18px; border-radius: 14px; background: var(--ink); color: #fff; cursor: pointer; transition: background .15s; }
  .newp .np-zip b { font-size: 15px; } .newp .np-zip span { font-size: 12px; color: rgba(255,255,255,.72); }
  .newp .np-zip:hover { background: #2a2c30; }
  .newp .np-zip input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .newp .np-steps { display: grid; gap: 8px; margin-top: 2px; }
  .newp .np-steps div { display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: baseline; font-size: 13px; color: var(--ink-2); line-height: 1.35; }
  .newp .np-steps i { font: 700 11px var(--mono); color: var(--mute); font-style: normal; }
  .zipbtn { position: relative; z-index: 1; display: inline-block; margin-top: 14px; border: 1px solid var(--ink); background: var(--ink); color: #fff; border-radius: 10px; padding: 9px 16px; font-weight: 600; font-size: 13px; cursor: pointer; }
  .zipbtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .drop.small .zipbtn { margin: 0 0 0 auto; flex: none; }
  .lead { margin: 6px 0 0; color: var(--ink-2); max-width: 70ch; }
  .files { display: grid; gap: 10px; margin-top: 14px; }
  .files details { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 0 18px; }
  .files summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 40px 1fr auto; gap: 14px; align-items: center; padding: 14px 0; }
  .files summary::-webkit-details-marker { display: none; }
  .files summary i { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 11px; background: var(--ink); color: #fff; font: 700 12px/1 var(--mono); font-style: normal; letter-spacing: .04em; }
  .files summary i.soft { background: var(--none-bg); color: var(--ink-2); border: 1px solid var(--line-2); }
  .files summary b { display: block; font-size: 16px; }
  .files summary span { display: block; font-size: 13px; color: var(--mute); margin-top: 2px; }
  .files summary em { font-style: normal; font-size: 12px; color: var(--mute); white-space: nowrap; }
  .files .frows { border-top: 1px solid var(--line); padding: 6px 0 12px; }
  .files .frow { display: grid; grid-template-columns: 96px 1fr auto; gap: 12px; padding: 8px 0; font-size: 13px; border-top: 1px solid var(--line); align-items: baseline; }
  .files .frow:first-child { border-top: 0; }
  .files .frow b { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--mute); font-weight: 600; }
  .files .frow.cur b { color: var(--ready); }
  .files .frow span { color: var(--ink-2); word-break: break-word; } .files .frow small { color: var(--mute); font-family: var(--mono); font-size: 11px; white-space: nowrap; }
  .rev { display: grid; gap: 14px; margin-top: 14px; }
  .rev .disc { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px 6px; }
  .rev .disc h4 { margin: 0 0 6px; font-size: 15px; display: flex; gap: 10px; align-items: baseline; } .rev .disc h4 small { color: var(--mute); font-weight: 500; font-size: 12px; }
  .rev .r { display: grid; grid-template-columns: 96px 1fr; gap: 14px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13px; position: relative; }
  .rev .r time { font-family: var(--mono); font-size: 12px; color: var(--mute); padding-top: 2px; } .rev .r.cur time { color: var(--ready); font-weight: 700; }
  .rev .r b { display: block; font-weight: 600; } .rev .r span { display: block; color: var(--mute); font-size: 12px; margin-top: 2px; word-break: break-word; }
  .occ { margin-top: 14px; display: grid; gap: 12px; }
  .occ .tally { display: flex; align-items: baseline; gap: 12px; } .occ .tally b { font-size: 34px; font-weight: 700; letter-spacing: -.03em; } .occ .tally span { color: var(--mute); font-size: 14px; }
  .occ .grp { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 18px 6px; }
  .occ .grp summary { list-style: none; cursor: pointer; display: flex; align-items: baseline; gap: 12px; padding: 4px 0 6px; }
  .occ .grp summary::-webkit-details-marker { display: none; }
  .occ .grp h4 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--mute); font-weight: 600; }
  .occ .grp summary .n { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--mute); white-space: nowrap; } .occ .grp.some summary .n { color: var(--ready); }
  .occ .grp summary::after { content: "+"; color: var(--mute); font-size: 16px; line-height: 1; margin-left: 10px; } .occ .grp[open] summary::after { content: "–"; }
  .occ .it { display: grid; grid-template-columns: 14px 1fr; gap: 12px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .occ .it i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line-2); display: inline-block; position: relative; top: 1px; } .occ .it.on i { background: var(--ready); border-color: var(--ready); }
  .occ .it span { display: block; font-size: 12px; color: var(--mute); word-break: break-word; } .occ .it.on span { color: var(--ready); }
  .occ .it:not(.on) b { font-weight: 500; }
  @media (max-width: 760px) { .files .frow, .rev .r { grid-template-columns: 1fr; gap: 2px; } }

  /* project page */
  .phead { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; padding: 30px 0 0; }
  .phead h1 { margin: 0; font-size: 30px; letter-spacing: -.02em; line-height: 1.2; }
  .phead .sub { color: var(--mute); margin-top: 4px; font-size: 14px; }
  .phead .btn { white-space: nowrap; }
  .tabs { display: flex; gap: 4px; margin-top: 22px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  .tabs a { white-space: nowrap; padding: 10px 14px; color: var(--mute); font-weight: 600; font-size: 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs a:hover { text-decoration: none; color: var(--ink); }
  .tabs a.on { color: var(--ink); border-bottom-color: var(--ink); }
  .tabs a small { font-weight: 500; color: var(--mute); margin-left: 6px; font-size: 12px; }

  .hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 28px; align-items: stretch; padding: 30px 0 22px; }
  .count { font-size: clamp(56px, 8vw, 96px); font-weight: 700; line-height: .95; letter-spacing: -.03em; margin: 0; }
  .count small { display: block; font-size: 20px; font-weight: 500; letter-spacing: 0; color: var(--ink-2); margin-top: 12px; }
  .hero .bar { height: 10px; margin-top: 26px; }
  .legend { display: flex; gap: 18px; margin-top: 12px; font-size: 13px; color: var(--mute); flex-wrap: wrap; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }

  .drop { position: relative; border: 2px dashed var(--line-2); border-radius: 18px; background: var(--card); display: flex; flex-direction: column;
          justify-content: center; align-items: center; text-align: center; padding: 34px 28px; min-height: 230px; transition: border-color .15s, background .15s; }
  .drop.over { border-color: var(--hot); background: #fff6ef; }
  .drop.big .arrow { width: 48px; height: 48px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 22px; margin-bottom: 14px; }
  .drop h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: -.01em; }
  .drop p { margin: 0; color: var(--mute); font-size: 14px; max-width: 34ch; }
  .drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .drop.small { min-height: 0; padding: 18px 20px; flex-direction: row; gap: 14px; text-align: left; justify-content: flex-start; }
  .drop.small h2 { font-size: 15px; margin: 0; } .drop.small p { font-size: 13px; max-width: none; }
  .drops { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }

  .status[hidden] { display: none; }
  .status { display: flex; align-items: center; gap: 12px; padding: 14px 18px; margin: 14px 0 0; border-radius: 12px; background: var(--card); border: 1px solid var(--line); font-size: 14px; }
  .status .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--none); flex: none; }
  .status.run .dot { background: var(--hot); animation: pulse 1s infinite alternate; }
  .status.ok .dot { background: var(--ready); } .status.bad .dot { background: var(--needs); }
  @keyframes pulse { from { opacity: .35 } to { opacity: 1 } }
  .status .fill { flex: 1; }
  .status .mono { font-family: var(--mono); font-size: 12px; color: var(--mute); }
  .status button, .btn { border: 1px solid var(--line-2); background: var(--card); border-radius: 8px; padding: 6px 12px; font-size: 13px; color: var(--ink); }
  .status button:hover, .btn:hover { border-color: var(--ink); text-decoration: none; }

  h3.sec { font-size: 13px; text-transform: uppercase; letter-spacing: .14em; color: var(--mute); margin: 40px 0 12px; font-weight: 600; }

  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  th, td { text-align: left; padding: 14px 16px; border-top: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--mute); font-weight: 600; border-top: 0; background: #fbfaf6; }
  tr.row { cursor: pointer; } tr.row:hover td { background: #fbfaf6; }
  td.id { font-family: var(--mono); font-size: 13px; color: var(--ink-2); white-space: nowrap; width: 1%; }
  td .what { font-weight: 600; } td .where { color: var(--mute); font-size: 13px; margin-top: 2px; }
  td.st { width: 1%; white-space: nowrap; } td.call { width: 18%; color: var(--mute); font-size: 13px; }
  td.go { width: 1%; color: var(--mute); }
  td.call:empty::before { content: "—"; }
  td.num { font-family: var(--mono); font-size: 13px; white-space: nowrap; }
  .pill { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
  .pill.ready { color: var(--ready); background: var(--ready-bg); } .pill.needs { color: var(--needs); background: var(--needs-bg); }
  .pill.unclear { color: var(--unclear); background: var(--unclear-bg); } .pill.none { color: var(--none); background: var(--none-bg); }
  .pill.lg { font-size: 14px; padding: 7px 14px; }

  .left { display: grid; gap: 10px; }
  .left .card { display: grid; grid-template-columns: 72px 1fr; gap: 14px; padding: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  .thumb { width: 72px; height: 72px; border-radius: 8px; overflow: hidden; background: #eee9dd; display: grid; place-items: center; color: var(--mute); font-family: var(--mono); font-size: 11px; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .file { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
  .card p { margin: 4px 0 0; font-size: 14px; color: var(--ink-2); }
  .empty { color: var(--mute); padding: 14px 0; }

  /* drawings tab */
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-top: 18px; }
  .sheet { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: pointer; transition: border-color .15s; }
  .sheet:hover { border-color: var(--ink); }
  .sheet img { width: 100%; aspect-ratio: 1.4; object-fit: cover; object-position: top left; display: block; background: #fff; border-bottom: 1px solid var(--line); }
  .sheet .cap { padding: 10px 12px; }
  .sheet .cap b { display: block; font-family: var(--mono); font-size: 12px; }
  .sheet .cap span { display: block; font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sheet .cap small { color: var(--mute); font-size: 12px; }

  /* messages tab */

<body>
<div class="wrap">

</div>
<div class="toast" id="toast"></div>
<div class="askbar" id="askbar" hidden>
  <div class="askpanel" id="askpanel" hidden></div>
  <form id="askform" autocomplete="off"><input type="text" id="askq" placeholder="Ask Closeout… e.g. what is still open at 6895?" maxlength="600"><button type="submit" id="askgo" aria-label="Ask">↑</button></form>

<script>
const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)];

const fileUrl = (id, page) => `/api/evidence/${id}/file` + (page ? `#page=${page}` : "");
const isImg = name => /\.(jpe?g|png|heic|heif|webp)$/i.test(name || "");
const state = { home: null, p: null, slug: null, es: null, run: { kind: "idle", text: "", done: 0, total: 0 }, fieldDisc: null, viewer: null, shot: null, openReview: null, finishing: null, drafting: null, mapping: null, docsAsking: false, filters: { bld: "", disc: "", rv: "" }, folder: [], pinMode: "" };

function toast(msg, err) { const t = $("#toast"); t.textContent = msg; t.className = "toast show" + (err ? " err" : ""); setTimeout(() => t.className = "toast", 3200); }
function route() {
  const c = location.pathname.match(/^\/c\/([^/]+)/); if (c) return { page: "contractor", token: decodeURIComponent(c[1]) };
  const h = location.hash.replace(/^#\/?/, "");
  let m = h.match(/^p\/([^/]+)\/item\/(.+)$/); if (m) return { page: "item", slug: m[1], id: decodeURIComponent(m[2]) };
  m = h.match(/^p\/([^/]+)\/field\/([^/]+)$/); if (m) return { page: "sheet", slug: m[1], sheetId: m[2] };
  m = h.match(/^p\/([^/]+)\/?(deficiencies|drawings|docs|field|evidence|messages)?$/); if (m) return { page: "project", slug: m[1], tab: m[2] === "evidence" ? "messages" : m[2] === "deficiencies" ? "list" : m[2] || "overview" };
  return { page: "home" };
}
const pUrl = (slug, tail) => `/api/projects/${encodeURIComponent(slug)}${tail || ""}`;

/* ---- plain-English status ---------------------------------------------- */
function status(i) {
  if (i.completeness === "complete") return { k: "ready", t: "Ready ✓" };
  if (i.completeness === "incomplete") { const t = [...new Set(i.missing_slots.map(m => m.type))]; return { k: "needs", t: "Needs " + t.join(" + ") }; }
  if (i.completeness === "needs_clarification") return { k: "unclear", t: "Unclear" };

}
const CALL = { accept: "Ready to close", reject: "Not accepted", hold: "On hold" };
function items() {
  const p = state.p, pk = p.packet;

  if (!pk) return p.register.map(blank);
  const seen = new Set(pk.items.map(i => i.item.item_id));
  return [...pk.items, ...p.register.filter(d => !seen.has(d.item_id)).map(blank)];
}

/* ---- data ----------------------------------------------------------- */
async function load() {
  const r = route();
  if (r.page === "contractor") {
    const res = await fetch(`/api/c/${encodeURIComponent(r.token)}`);
    state.p = res.ok ? await res.json() : null; state.slug = r.token;
    render(); return;
  }
  if (r.page === "home") {
    state.home = await (await fetch("/api/projects")).json();
    if (state.home.active_run_id && !state.es) follow(state.home.active_run_id);
  } else {
    const res = await fetch(pUrl(r.slug));
    if (!res.ok) { state.p = null; state.slug = r.slug; render(); return; }
    state.p = await res.json(); state.slug = r.slug;

  const r = route(), p = state.p;

  if (r.page === "contractor") { document.body.classList.add("contractor"); $("#crumbs").innerHTML = p ? `<span>${esc(p.project.name)}</span>` : ""; renderContractor(); renderAsk(); return; }
  if (r.page === "home") renderHome();
  else if (!p) $("#main").innerHTML = `<a class="back" href="#/">← Projects</a><p class="empty">That project is not here.</p>`;
  else if (r.page === "item") renderItem(r.id);
  else if (r.page === "sheet") renderSheet(r.sheetId);
  else renderProject(r.tab);
  renderAsk();
}

/* ---- projects home --------------------------------------------------- */
function cardLast(c) {
  const bits = [];
  if (c.reviews_active) bits.push(`${c.reviews_active} review${c.reviews_active === 1 ? "" : "s"} in progress`);
  if (c.links) bits.push(`${c.links} contractor link${c.links === 1 ? "" : "s"} active`);
  const lastD = c.last_drop_at || "", lastM = c.last_message_at || "";
  if (lastD && lastD >= lastM) bits.push(`evidence in ${esc(when(lastD))}`);
  else if (lastM) bits.push(`message drafted ${esc(when(lastM))}`);
  else if (c.last_activity) bits.push(`updated ${esc(when(c.last_activity))}`);
  return bits.map(b => `<span>${b}</span>`).join("");
}
function renderHome() {
  const h = state.home, list = h.projects;
  $("#main").innerHTML = `
    <div class="homehead"><div><h1>Projects</h1><p>${list.length ? "Open a project to review its deficiencies, drawings and the evidence contractors sent." : "Start with a project: upload one zip of its folder. The app files it, reads the current sheets and lists what is missing."}</p></div></div>
    <div class="status ${esc(state.run.kind)}" id="status" ${state.run.kind === "idle" ? "hidden" : ""}></div>
    <div class="cards" style="margin-top:18px">
      ${list.map(c => { const pct = k => c.items ? (c[k] / c.items * 100) + "%" : "0%"; return `
      <div class="pcard" data-slug="${esc(c.slug)}">
        ${c.active ? `<span class="live" title="Working"></span>` : ""}
        <h2>${esc(c.name)}</h2>

function itemBuilding(d, blds) {
  const unit = (d.unit || "").trim().toLowerCase();
  const byUnit = unit ? blds.find(b => b.units.some(u => u.label.replace(/\s*\(.*$/, "").trim().toLowerCase() === unit)) : null;
  if (byUnit) return byUnit.key;
  const m = buildingOf(d.location || "");
  return m && blds.some(b => b.key === m.key) ? m.key : "";
}

}

/* The Documents tab as a folder tree, the way a file explorer shows it. Two top folders: the occupancy paperwork
   arranged by the sections of the CRP's checklist (so anyone can tell which section to look in), and the project folder
   itself: Site first, then one folder per building, each with a folder per discipline holding the letters, forms and
   drawing issues that belong there. Blanks (what is not on file yet) are dashed rows inside the right folder. Anything
   the CRP list carries that this project does not need (say, building envelope) is ticked "not in scope" and drops out
   of the count; it stays one tap away at the bottom of its section. On a wide screen the tree sits on the left and the
   open folder on the right; on a phone you drill in folder by folder. */
function folderTree(pr) {
  const blds = buildings(), rv = state.p.docs_review, discs = pr.disciplines || [], dn = c => DISC_NAMES[c] || c;
  const placed = new Map(((rv || {}).placed || []).map(x => [x.file, x]));
  const missing = rv ? rv.missing : [], onFile = (rv || {}).on_file || [], scope = new Set(state.p.docs_scope || []);
  const copies = {}; (pr.documents || []).forEach(d => { const k = baseName(d) + "|" + (d.dated || ""); copies[k] = (copies[k] || 0) + 1; });
  const seenDoc = new Set(), docs = (pr.documents || []).filter(d => { const k = baseName(d) + "|" + (d.dated || ""); if (seenDoc.has(k)) return false; seenDoc.add(k); return true; });
  const folder = (key, name, meta, opts = {}) => ({ key, name, meta, kind: "folder", folders: [], items: [], ...opts });
  const fileItem = d => ({ kind: "file", id: d.id, name: baseName(d), meta: [d.kind === "drawing" ? (d.is_current ? "current set" : "older issue") : d.kind === "document" ? "letter or form" : "file", d.dated ? "issued " + d.dated : "", d.pages ? d.pages + " p." : "", copies[baseName(d) + "|" + (d.dated || "")] > 1 ? copies[baseName(d) + "|" + (d.dated || "")] + " copies in the folder" : ""].filter(Boolean).join(" · "), path: d.rel_path, current: d.kind === "drawing" && d.is_current });
  const ghost = (m, who) => ({ kind: "ghost", name: m.what, meta: m.why, who });
  // the CRP checklist, section by section
  const crp = folder("crp", "Documents before occupancy", "the CRP's checklist, section by section", { crp: true });
  const secs = new Map();
  (state.p.occupancy_docs || []).forEach(([grp, name, re]) => {
    if (!secs.has(grp)) { const f = folder("crp/" + secs.size, grp, "", { sec: true }); secs.set(grp, f); crp.folders.push(f); }
    const rx = new RegExp(re, "i"), files = [...new Set([...docs.filter(d => rx.test(baseName(d))).map(baseName), ...onFile.filter(o => o.checklist === name).map(o => o.file)])];
    secs.get(grp).items.push({ kind: "check", name, files, out: scope.has(name), agent: onFile.some(o => o.checklist === name) });
  });
  secs.forEach(f => { const inn = f.items.filter(i => !i.out); f.got = inn.filter(i => i.files.length).length; f.need = inn.length; f.out = f.items.length - inn.length; f.meta = `${f.got} of ${f.need} on file${f.out ? ` · ${f.out} not in scope` : ""}`; });
  // the project folder: site, then one folder per building
  const site = folder("site", "Site", "everything that covers all buildings", { site: true });
  const siteDisc = {}, codes = [...new Set([...discs.map(d => d.code), ...docs.map(d => d.discipline)])];
  codes.forEach(code => { const f = folder("site/" + code, code in DISC_NAMES ? dn(code) : groupName(code), "", { code }); siteDisc[code] = f; site.folders.push(f); });
  docs.forEach(d => { if (placed.get(baseName(d))) return; (siteDisc[d.discipline] || siteDisc.OTHER || site).items.push(fileItem(d)); });
  missing.filter(m => !m.building).forEach(m => (siteDisc[m.discipline] || site).items.push(ghost(m, "agent")));
  const bfs = blds.map(b => {
    const units = b.units.map(u => u.label.replace(/\s*\(.*$/, "")).join(", ");
    const bf = folder("b/" + b.key, b.name, units || "named on the drawings", { bld: b.key, badge: b.key });
    discs.forEach(d => {
      const f = folder("b/" + b.key + "/" + d.code, dn(d.code), "", { code: d.code });
      docs.filter(x => { const pl = placed.get(baseName(x)); return pl && pl.building === b.name && (pl.discipline || x.discipline) === d.code; }).forEach(x => f.items.push({ ...fileItem(x), who: "agent" }));
      missing.filter(m => m.building === b.name && (m.discipline || "") === d.code).forEach(m => f.items.push(ghost(m, "agent")));
      if (f.items.length) bf.folders.push(f);
    });
    missing.filter(m => m.building === b.name && !discs.some(d => d.code === m.discipline)).forEach(m => bf.items.push(ghost(m, "agent")));
    if (!bf.folders.length && !bf.items.length) bf.note = "Nothing filed under this building yet.";
    return bf;
  });
  const prj = folder("prj", "Project folder", "as it came, filed by site, building and discipline", { prj: true });
  prj.folders.push(site, ...bfs);
  const root = folder("", pr.name, [pr.address, pr.city].filter(Boolean).join(", "), { root: true });
  root.folders.push(crp, prj);
  const count = f => { f.n = f.items.filter(i => i.kind === "file" || (i.kind === "check" && i.files.length && !i.out)).length + f.folders.reduce((a, c) => a + count(c), 0); f.ghosts = f.items.filter(i => i.kind === "ghost" || (i.kind === "check" && !i.files.length && !i.out)).length + f.folders.reduce((a, c) => a + c.ghosts, 0); return f.n; };
  count(root);
  return root;
}

/* What to ask the client or the architect for before the first field review. Plain code over the sheet readings; no agent call,
   nothing invented: every line points at something the folder does or does not contain. */

  const sheetsOf = code => pr.sheets.filter(sh => sh.discipline === code);
  const kindOf = sh => (sh.read || {}).sheet_kind || "";
  for (const d of discs) {
    const shs = sheetsOf(d.code), plans = shs.filter(isPlanSheet), name = DISC_NAMES[d.code] || d.name || d.code;
    if (!shs.length) { out.push({ code: d.code, what: `${name} drawings`, why: `The folder has a ${name.toLowerCase()} set but none of its sheets could be read.` }); continue; }
    if (!plans.length) {
      const has = [...new Set(shs.map(kindOf).filter(Boolean))].map(k => k.replace(/_/g, " ")).join(", ");
      out.push({ code: d.code, what: `${name} floor plans, one per building`, why: `The current ${name.toLowerCase()} set (${shs.length} sheet${shs.length === 1 ? "" : "s"}: ${has}) has no floor plans. On site the architectural plans stand in.` });
    } else {
      const missing = blds.filter(b => !plans.some(sh => sheetMentions(sh, b)));
      if (missing.length) out.push({ code: d.code, what: `${name} floor plan for ${missing.map(b => b.name).join(", ")}`, why: `The set has floor plans for the other building${blds.length - missing.length === 1 ? "" : "s"} but none that mentions ${missing.length === 1 ? "this one" : "these"}.` });
    }
  }
  // Sheets every set of that discipline is expected to carry. A sheet counts when the agent read it as that kind or its
  // title or summary says so; the line names the sheets looked at so the engineer can check the claim in a minute.
  const text = sh => ((sh.title || "") + " " + ((sh.read || {}).summary || "")).toUpperCase();
  const is = (kind, re) => sh => kindOf(sh) === kind || re.test(text(sh));
  const site = is("site_plan", /SITE PLAN|SITE SERVIC/), notes = is("notes", /\bNOTES\b|SPECIFICATION/), sched = is("schedule", /SCHEDULE/);
  const EXPECT = {
    AR: [["Site plan", site], ["Elevations", is("elevation", /ELEVATION/)], ["Building sections", is("section", /\bSECTION/)]],
    EL: [["Electrical site plan with the service entry", site], ["Single-line diagram", sh => /SINGLE.?LINE|\bSLD\b|RISER DIAGRAM/.test(text(sh))], ["Electrical notes and specifications", notes], ["Panel schedule", is("schedule", /PANEL SCHEDULE|SCHEDULE/)]],
    PL: [["Plumbing site plan with the services", site], ["Plumbing notes and specifications", notes], ["Fixture schedule", sched]],
    ME: [["Mechanical notes and specifications", notes], ["Equipment schedule", sched]],
    ST: [["Structural general notes", notes], ["Structural details", is("details", /DETAIL/)]],
    FP: [["Fire protection notes", notes]], SP: [["Sprinkler notes", notes]],
    LA: [["Landscape plan", is("landscape", /LANDSCAPE/)]], CV: [["Site servicing plan", site]],
  };
  for (const d of discs) {
    const shs = sheetsOf(d.code), name = DISC_NAMES[d.code] || d.name || d.code;
    if (!shs.length) continue;
    const looked = shs.map(sh => sh.sheet_number || "p." + sh.page).join(", ");
    for (const [what, test] of EXPECT[d.code] || []) {
      if (shs.some(test)) continue;
      out.push({ code: d.code, what, why: `The current ${name.toLowerCase()} set has no sheet titled or read as ${what.toLowerCase()}. Looked at ${looked}.` });
    }
  }
  const dated = discs.filter(d => d.dated).sort((a, b) => a.dated < b.dated ? 1 : -1);
  if (dated.length > 1) {
    const newest = dated[0], old = dated.filter(d => d.dated < newest.dated);
    for (const d of old) out.push({ code: d.code, what: `Confirm the ${(DISC_NAMES[d.code] || d.name || d.code).toLowerCase()} set is the latest issued`, why: `Its folder is dated ${d.dated}; the ${(DISC_NAMES[newest.code] || newest.name).toLowerCase()} set is dated ${newest.dated}. A field review against a superseded set is wasted.` });
  }
  const noDate = discs.filter(d => !d.dated);
  for (const d of noDate) out.push({ code: d.code, what: `Issue date and revision of the ${(DISC_NAMES[d.code] || d.name).toLowerCase()} set`, why: "No date could be read from the folder or the file name." });
  return out;
}

function renderRevisions(pr) {
  const drawings = (pr.documents || []).filter(d => d.kind === "drawing"), by = {};
  for (const d of drawings) {
    const key = d.discipline + "|" + (d.dated || "") + "|" + baseName(d).toLowerCase();
    const e = by[key] = by[key] || { code: d.discipline, dated: d.dated, name: baseName(d), notes: [], current: false, copies: 0 };
    e.copies++; e.current = e.current || !!d.is_current;
    const n = issueNote(d); if (n && !e.notes.includes(n)) e.notes.push(n);
  }
  const discs = {};
  Object.values(by).forEach(e => (discs[e.code] = discs[e.code] || []).push(e));
  const codes = Object.keys(discs).sort((a, b) => (a in DISC_NAMES ? 0 : 1) - (b in DISC_NAMES ? 0 : 1) || a.localeCompare(b));
  return `<div class="rev">${codes.map(code => { const rows = discs[code].sort((a, b) => (b.dated || "") < (a.dated || "") ? -1 : 1);
    return `<div class="disc"><h4>${esc(groupName(code))}<small>${rows.length} issue${rows.length === 1 ? "" : "s"}</small></h4>
      ${rows.map(e => `<div class="r ${e.current ? "cur" : ""}"><time>${esc(e.dated || "undated")}</time><div><b>${esc(e.notes.join(" · ") || (e.current ? "Current set" : "Issue"))}${e.current ? ` <em style="color:var(--ready);font-style:normal;font-size:12px">current</em>` : ""}</b><span>${esc(e.name)}${e.copies > 1 ? ` · filed ${e.copies} times` : ""}</span></div></div>`).join("")}
    </div>`; }).join("")}</div>`;
}
/* The office's own list of what the coordinating professional collects before final occupancy (from the QA tracker), served

function sentCard(f, unresolved) {
  let how, cls = "sure";
  if (unresolved) {
    cls = "unsure";
    how = f.kind === "weak_match" ? "Fits this item, but nothing on the file confirms where it was taken" : f.kind === "ambiguous" ? `Could be ${(f.candidates || []).join(" or ")}` : `Says it is somewhere else (${(f.flags || []).includes("conflicting_reference") ? "its own label contradicts the list" : "conflict"})`;
  } else {
    const fl = f.flags || [];
    how = f.tier === "explicit" ? "Named on the file or in the note" : f.tier === "strong" ? (fl.includes("location_by_reference") ? "Same spot as the engineer's photo" : fl.includes("location_from_sequence") ? "Taken right after a photo that names the place" : "Place and scope both on the file") : "Location not confirmed";
    if (f.tier === "weak") cls = "unsure";
  }
  const obs = (f.observations || []).filter(o => o.text).map(o => o.text);
  const src = (f.sources || []).map(s => `<a href="${fileUrl(s.evidence_id, s.page)}" target="_blank">open${s.page ? ` page ${s.page}` : ""}</a>`).join(" · ");
  return `<div class="card"><div class="thumb">${isImg(f.filename) ? `<img src="${fileUrl(f.evidence_id)}" alt="">` : esc((f.filename || "").split(".").pop().toUpperCase())}</div>
    <div><div class="file">${esc(f.filename)}</div>
      <div class="how ${cls}"><b>${esc(how)}</b>${!unresolved && f.slot_index >= 0 ? ` · fills “${esc(slotName(f))}”` : ""}</div>
      <p>${esc(f.rationale)}</p>${obs.length ? `<details class="obs"><summary>${obs.length} things in the ${isImg(f.filename) ? "photo" : "file"}</summary><ul>${obs.map(o => `<li>${esc(o)}</li>`).join("")}</ul></details>` : ""}
      <div class="open">${src}</div></div></div>`;
}
function dedupe(hist) {
  const out = []; let last = "";
  for (const h of hist) { const k = h.run_started_at + "|" + h.completeness; if (k !== last) out.push(h); last = k; }
  return out;
}
function slotName(f) {
  const i = items().find(x => x.evidence.some(e => e.finding_id === f.finding_id));
  const sl = i && i.item.slots[f.slot_index];
  return sl ? sl.type : "";
}

      ${v.photoUrl ? `<div class="shot"><div class="take"><img src="${v.photoUrl}" alt=""><input type="file" accept="image/*" capture="environment" id="photoIn"></div><div class="note"><label style="margin-top:0">Location a contractor can walk to</label><input id="fLoc" value="${esc(s.location || "")}" placeholder="Unit C, Upper Floor, Bath 2: wall behind toilet"></div></div>` : `<label>Location a contractor can walk to</label><input id="fLoc" value="${esc(s.location || "")}" placeholder="Unit C, Upper Floor, Bath 2: wall behind toilet">`}
      <div class="row">
        <div><label>Unit</label><select id="fUnit">${opts(units, s.unit || "")}</select></div>
        <div><label>Level</label><select id="fLevel">${opts(levels, s.level || "")}</select></div>
        <div><label>Room</label><input id="fSpace" value="${esc(s.space || "")}" placeholder="Bath 2"></div>
      </div>
      <label>What is wrong</label><textarea id="fDesc" placeholder="Receptacle beside the basin has no GFCI protection and the cover plate is missing.">${esc(s.description || "")}</textarea>
      <label>What the contractor must send to close it</label><input id="fEv" value="${esc(s.evidence_required || "photo: completed work")}" placeholder="photo: repaired; report: test sheet">
      <div class="agentnote">Separate several with “;”</div>
      <div class="acts"><button class="btn primary" id="save" ${v.draft ? "" : "disabled"}>Save as ${esc(rv ? rv.discipline : sh.discipline)}-${String(nextNumber(rv ? rv.discipline : sh.discipline)).padStart(2, "0")}</button>${!v.draft ? `<span class="agentnote">Tap the spot on the sheet first</span>` : !v.photoUrl ? `<span class="agentnote">No photo yet</span>` : ""}<button class="cancel" id="cancel">Cancel</button></div>`;
  const pin = $("#photoIn"); if (pin) pin.onchange = () => { const f = pin.files[0]; if (!f) return; v.photo = f; if (v.photoUrl) URL.revokeObjectURL(v.photoUrl); v.photoUrl = URL.createObjectURL(f); renderPanel(sh, rv); };
  const note = $("#noteIn"); if (note) note.oninput = () => v.note = note.value;
  const cancel = $("#cancel"); if (cancel) cancel.onclick = () => { resetDraft(); render(); };
  const manual = $("#manual"); if (manual) manual.onclick = () => { v.step = "form"; v.sug = null; renderPanel(sh, rv); };
  const ask = $("#ask"); if (ask) ask.onclick = () => askAgent(sh, rv);
  const save = $("#save"); if (save) save.onclick = () => { if (v.draft) saveFinding(sh, rv); };
}
function nextNumber(code) { let n = 0; state.p.register.forEach(d => { const m = d.item_id.match(new RegExp("^" + code + "-(\\d+)$")); if (m) n = Math.max(n, +m[1]); }); return n + 1; }
function resetDraft() { const v = state.viewer; if (!v) return; if (v.photoUrl) URL.revokeObjectURL(v.photoUrl); Object.assign(v, { draft: null, step: "idle", photo: null, photoUrl: null, note: "", sug: null, busy: false, gps: "", carry: false }); }
async function askAgent(sh, rv) {
  const v = state.viewer; v.step = "thinking"; v.busy = true; renderPanel(sh, rv);
  const fd = new FormData(); fd.append("sheet_id", sh.id); fd.append("pin_x", v.draft.x); fd.append("pin_y", v.draft.y); fd.append("note", v.note); fd.append("discipline", rv ? rv.discipline : sh.discipline);
  if (v.photo) fd.append("photo", v.photo, v.photo.name || "photo.jpg");
  try {
    const r = await fetch(pUrl(state.slug, "/findings/suggest"), { method: "POST", body: fd });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { toast(j.detail || "Could not write it up. Write it yourself", true); v.sug = null; }
    else { v.sug = j.suggestion; toast("Suggestion ready"); }
  } catch (e) { toast("Lost the connection; write it yourself", true); v.sug = null; }
  v.busy = false; v.step = "form"; renderPanel(sh, rv);
}
async function saveFinding(sh, rv) {
  const v = state.viewer; if (!rv) return toast("Start a field review first", true); if (!v.draft) return toast("Tap the spot on the sheet first", true);
  const fd = new FormData(); if (v.gps) fd.append("gps", v.gps);
  fd.append("sheet_id", sh.id); fd.append("pin_x", v.draft.x); fd.append("pin_y", v.draft.y); fd.append("review_id", rv.id);
  fd.append("location", $("#fLoc").value); fd.append("description", $("#fDesc").value); fd.append("evidence_required", $("#fEv").value);
  fd.append("unit", $("#fUnit").value); fd.append("level", $("#fLevel").value); fd.append("space", $("#fSpace").value); fd.append("note", v.note);
  fd.append("discipline", v.sug && v.sug.discipline ? v.sug.discipline : rv.discipline);
  if (v.photo) fd.append("photo", v.photo, v.photo.name || "photo.jpg");
  $("#save").disabled = true;
  const r = await fetch(pUrl(state.slug, "/findings"), { method: "POST", body: fd });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { $("#save").disabled = false; return toast(j.detail || "Could not save", true); }
  toast(`${j.item.item_id} saved · ${j.item.location}`); resetDraft(); await load();
}

/* ---- live run feed --------------------------------------------------- */
function follow(runId, onDone) {
  if (state.es) state.es.close();
  state.run = { kind: "run", text: "Starting…", done: 0, total: 0 }; renderStatus();
  const es = new EventSource(`/api/runs/${runId}/events`);
  state.es = es;
  const onAny = ev => {
    const e = JSON.parse(ev.data), d = e.data || {};
    switch (e.event) {
      case "uploaded": state.run.text = `Uploaded ${d.files} files. Checking them…`; break;
      case "ingested": state.run.text = `${d.new} new files, ${d.existing} already on record.`; break;
      case "project_scanned": state.run.text = `Found ${d.documents} documents. Rendering the current sheets…`; break;
      case "sheet_rendered": state.run.text = `Rendering ${d.discipline} page ${d.page} of ${d.of}…`; break;
      case "jobs_created": state.run.total = d.match_jobs || d.sheet_jobs || 0; state.run.done = 0; state.run.text = `Reading ${state.run.total} ${d.sheet_jobs ? "sheets" : "files"}…`; break;
      case "job_start": if (d.kind === "draft") state.run.text = `Drafting the message for ${d.item_id}…`; else if (d.kind === "project_summary") state.run.text = "Summarising the project…"; else state.run.text = `Reading ${d.label || d.filename}…`; break;
      case "job_done": if (d.kind !== "draft" && d.kind !== "project_summary") state.run.done++; break;
      case "job_failed": state.run.text = `Could not read ${d.label || d.filename || d.item_id}: ${d.error}`; break;
      case "completeness": state.run.text = "Checking what each item still needs…"; break;
      case "packet": case "project_ready": case "run_error":
        es.close(); state.es = null;
        const bad = e.event === "run_error" || d.failed_jobs > 0 || d.status === "failed";
        state.run = { kind: bad ? "bad" : "ok", text: e.event === "run_error" ? "Something went wrong. Try again." : bad ? `Finished, but ${d.failed_jobs} file${d.failed_jobs === 1 ? "" : "s"} could not be read.` : e.event === "project_ready" ? `Project read: ${d.name}.` : "Done. Every file has been filed.", done: 0, total: 0 };
        if (onDone) onDone(e.event, d); else load();
        return;
    }
    renderStatus();
    if (e.event === "completeness" || e.event === "job_done") load();
  };
  ["uploaded", "ingested", "project_scanned", "sheet_rendered", "sheets_ready", "jobs_created", "job_start", "job_done", "job_failed", "completeness", "packet", "project_ready", "run_error", "retry"].forEach(k => es.addEventListener(k, onAny));
  es.onerror = () => { if (state.es === es) { es.close(); state.es = null; state.run = { kind: "bad", text: "Lost the connection. Reload to see where it got to.", done: 0, total: 0 }; load(); } };
}

/* ---- folder drops ---------------------------------------------------- */
async function walk(entry, prefix, out) {
  if (entry.isFile) { const f = await new Promise((res, rej) => entry.file(res, rej)); out.push({ file: f, path: prefix + entry.name }); }
  else if (entry.isDirectory) {
    const reader = entry.createReader(); let batch;
    do { batch = await new Promise((res, rej) => reader.readEntries(res, rej)); for (const e of batch) if (!e.name.startsWith(".")) await walk(e, prefix + entry.name + "/", out); } while (batch.length);
  }
}
async function filesFromDrop(dt, keepTop) {
  const out = [];
  const entries = [...dt.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (entries.length) { for (const e of entries) await walk(e, "", out); }
  else for (const f of dt.files) out.push({ file: f, path: f.name });
  const top = new Set(out.map(o => o.path.split("/")[0]));
  if (!keepTop && top.size === 1 && out.every(o => o.path.includes("/"))) out.forEach(o => o.path = o.path.split("/").slice(1).join("/"));
  return out.filter(o => !o.path.split("/").some(p => p.startsWith(".")));
}
function filesFromInput(input, keepTop) {
  return [...input.files].map(f => ({ file: f, path: keepTop ? (f.webkitRelativePath || f.name) : ((f.webkitRelativePath || f.name).split("/").slice(1).join("/") || f.name) })).filter(o => !o.path.split("/").some(p => p.startsWith(".")));
}
async function send(kind, slug, items, label) {
  if (!items.length) return toast("Nothing to upload", true);
  const fd = new FormData();
  items.forEach(o => { fd.append("files", o.file, o.file.name); fd.append("paths", o.path); });
  if (kind === "batch" && label) fd.append("label", label);
  if (kind === "project" && label) fd.append("slug", label.toLowerCase().replace(/[^a-z0-9]+/g, "-"));
  const zip = items.length === 1 && /\.zip$/i.test(items[0].file.name);
  toast(zip ? `Uploading ${items[0].file.name} (${Math.max(1, Math.round(items[0].file.size / 1048576))} MB)…` : `Uploading ${items.length} files…`);
  const url = kind === "project" ? "/api/projects" : kind === "contractor" ? `/api/c/${encodeURIComponent(slug)}/batches` : pUrl(slug, { batch: "/batches", register: "/register", drawings: "/drawings" }[kind]);
  const r = await fetch(url, { method: "POST", body: fd });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) return toast(r.status === 409 && kind === "contractor" ? "Something is being filed right now. Try again in a minute." : j.detail || `Upload failed (${r.status})`, true);
  if (kind === "register") { toast(`Deficiency list loaded: ${j.imported} items`); load(); }
  else if (kind === "project") { load(); follow("pending", () => { location.hash = pHash(j.slug); load(); }); }
  else follow("pending");
}
function wireDrop(el, kind, slug) {
  if (!el) return;
  const keepTop = kind === "project" || kind === "drawings";
  el.addEventListener("dragover", e => { e.preventDefault(); el.classList.add("over"); });
  el.addEventListener("dragleave", () => el.classList.remove("over"));
  el.addEventListener("drop", async e => { e.preventDefault(); el.classList.remove("over"); const items = await filesFromDrop(e.dataTransfer, keepTop); const ent = e.dataTransfer.items[0] && e.dataTransfer.items[0].webkitGetAsEntry && e.dataTransfer.items[0].webkitGetAsEntry(); send(kind, slug, items, ent && ent.isDirectory ? ent.name : null); });
  el.querySelectorAll("input[type=file]").forEach(input => input.addEventListener("change", () => {
    if (!input.files.length) return;
    const items = filesFromInput(input, keepTop), first = input.files[0];
    const label = first.webkitRelativePath ? first.webkitRelativePath.split("/")[0] : null;   // a zip names the project from the folder inside it
    send(kind, slug, items, label); input.value = "";
  }));
}
function zipBtn(text) { return `<label class="zipbtn">${esc(text)}<input type="file" accept=".zip,application/zip,application/x-zip-compressed"></label>`; }

window.addEventListener("hashchange", () => { const r = route(); if (r.page === "home" && state.p) { state.p = null; } if (r.page !== "sheet") { resetDraft(); state.viewer = null; } if (!(r.page === "project" && r.tab === "field") && r.page !== "sheet" && state.shot) { URL.revokeObjectURL(state.shot.photoUrl); state.shot = null; } load(); });
load();

/* ---- Ask Closeout ------------------------------------------------------ */
const askState = { busy: false, last: null };
function askWhere() {
  const r = route();
  const w = { tab: r.page === "project" ? (r.tab === "list" ? "deficiencies" : r.tab) : r.page, filters: { ...state.filters } };
  if (r.page === "item") w.item_id = r.id;
  if (r.page === "sheet") { const sh = (state.p.project.sheets || []).find(x => x.id === r.sheetId); if (sh) w.sheet = sh.sheet_number; }
  return w;
}
function renderAsk() {
  const r = route(), on = !!state.p && (r.page === "project" || r.page === "item" || r.page === "sheet");
  document.body.classList.toggle("askable", on);
  $("#askbar").hidden = !on;
  $("#askq").placeholder = window.innerWidth <= 760 ? "Ask Closeout…" : "Ask Closeout… e.g. what is still open at 6895?";
  if (!on) { $("#askpanel").hidden = true; askState.last = null; }
}
function askPanel(q, a, went, wait) {
  const el = $("#askpanel");
  el.innerHTML = `<div class="q">${esc(q)}</div><div class="a${wait ? " wait" : ""}">${esc(a)}</div>${went ? `<div class="went">${esc(went)}</div>` : ""}${wait ? "" : `<div class="fine">From this project's records. Closeout answers; the engineer decides.</div>`}<button class="x" type="button" aria-label="Close">×</button>`;
  el.hidden = false;
  el.querySelector(".x").onclick = () => { el.hidden = true; };
}
function goLabel(go) {
  const p = state.p;
  const names = { overview: "the overview", deficiencies: "the deficiencies", field: "the field review", drawings: "the drawings", docs: "the documents", messages: "the messages" };
  if (go.screen === "item") return `Opened ${go.item_id}`;
  if (go.screen === "sheet") return `Opened sheet ${go.sheet || ""}`;
  const bits = [];
  if (go.building) { const b = buildings().find(x => x.key === go.building); bits.push(b ? b.name : go.building); }
  if (go.discipline) bits.push(DISC_NAMES[go.discipline] || go.discipline);
  if (go.review) { const rv = (p.reviews || []).find(x => x.id === go.review); if (rv) bits.push(rv.title); }
  return `Took you to ${names[go.screen] || go.screen}${bits.length ? " · " + bits.join(" · ") : ""}`;
}
function applyGo(go) {
  if (!go || !go.screen) return "";
  const slug = state.slug;
  let hash;
  if (go.screen === "item") hash = pHash(slug, "/item/" + encodeURIComponent(go.item_id));
  else if (go.screen === "sheet") hash = pHash(slug, "/field/" + encodeURIComponent(go.sheet_id));
  else {
    if (go.screen === "deficiencies") state.filters = { bld: go.building || "", disc: go.discipline || "", rv: go.review || "" };
    if (go.screen === "field") { if (go.discipline) state.fieldDisc = go.discipline; if (go.review) state.openReview = go.review; }
    hash = pHash(slug, go.screen === "overview" ? "" : "/" + go.screen);
  }
  if (location.hash === hash) render(); else location.hash = hash;
  window.scrollTo({ top: 0, behavior: "smooth" });
  return goLabel(go);
}
async function askSend() {
  const input = $("#askq"), q = input.value.trim();
  if (!q || askState.busy) return;
  askState.busy = true; $("#askbar").classList.add("busy"); $("#askgo").disabled = true;
  askPanel(q, "Looking through the records…", "", true);
  try {
    const r = await fetch(pUrl(state.slug, "/ask"), { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ question: q, where: askWhere() }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.detail || "Closeout could not answer that just now");
    const went = applyGo(j.go);
    askPanel(q, j.answer, went, false);
    input.value = "";
  } catch (e) {
    askPanel(q, e.message || "Closeout could not answer that just now; ask again", "", false);
  } finally {
    askState.busy = false; $("#askbar").classList.remove("busy"); $("#askgo").disabled = false;
  }
}
$("#askform").onsubmit = e => { e.preventDefault(); askSend(); };
</script>
